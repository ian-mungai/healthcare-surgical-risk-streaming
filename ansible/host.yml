- name: Set up the platform host
  hosts: platform
  become: true
  gather_facts: true

  pre_tasks:
    - name: Refuse a host that is not x86-64 Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_facts['architecture'] == 'x86_64'
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
        fail_msg: This playbook supports x86-64 Ubuntu 24.04 only.

  roles:
    - metadata_guard
    - docker
    - k3s
    - workload_access
    - unlock_key
    - compose_stack
