# Every version is pinned. Change a pin only with its checksum, after reading the tool's release notes.
docker_signing_file_sha256: 1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
docker_packages:
  - docker-ce=5:29.9.3-1~ubuntu.24.04~noble
  - docker-ce-cli=5:29.9.3-1~ubuntu.24.04~noble
  - containerd.io=2.4.2-4~ubuntu.24.04~noble
  - docker-compose-plugin=5.8.0-1~ubuntu.24.04~noble
docker_log_max_size: 50m
docker_log_max_file: "5"

k3s_version: v1.37.2+k3s1
k3s_install_script_sha256: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b
k3s_ready_deadline_seconds: 300

# The host commands pass the region and one entry for each workload role in the run's Terraform outputs.
workload_access_region: ""
workload_access_workloads: []

# The services that may reach instance metadata, as systemd unit names in system.slice. Every other process is refused.
metadata_guard_allowed_units:
  - workload-credentials.service
  - tailscaled.service
  - tailscale-join.service
  - cloud-init-local.service
  - cloud-init.service
  - cloud-init-main.service
  - cloud-config.service
  - cloud-final.service

# The container runtimes. Each requires the metadata guard unit, so none starts while the guard has failed to load.
metadata_guard_runtime_units:
  - docker.service
  - containerd.service
  - k3s.service

# The folder of the systemd units and their drop-ins.
metadata_guard_unit_directory: /etc/systemd/system

# Every secret file that a container reads is owned by the numeric user that container runs as, has mode 0400 and is read by nobody else. A file that no
# container reads is owned by root the same way. The numeric user and group of root, and the user of the OpenBao container, are here. The user of a
# PostgreSQL tool and of an OpenBao service is on its line in compose/openbao_services.txt. Each must equal the user in the service's Compose file (a fast test checks it).
secret_files_root_owner: "0:0"
openbao_user: "100:1000"
# The user of the Grafana container, the owner of its administrator password file (the image runs as user 472 in group 0).
grafana_user: "472:0"

# The secret store's unlock key file on the host. It is owned by the user of the OpenBao container, so the deploy user does not read it. The folder is the deploy user's.
unlock_key_directory: /opt/platform
unlock_key_file: "{{ unlock_key_directory }}/.env"
unlock_key_owner: ubuntu
unlock_key_group: ubuntu

# The Compose stack. The password files live outside the placed Compose files, in a folder that only root reads.
compose_stack_directory: /opt/platform
compose_stack_compose_directory: "{{ compose_stack_directory }}/compose"
compose_stack_secrets_directory: "{{ compose_stack_directory }}/secrets"
# One line for each tool that needs a PostgreSQL account and database.
compose_stack_tools_file: "{{ compose_stack_compose_directory }}/postgres_tools.txt"
# One line for each service that reads a secret. A numeric user and group at the end of a line name the owner of that service's files.
compose_stack_services_file: "{{ compose_stack_compose_directory }}/openbao_services.txt"
compose_stack_owner: root
compose_stack_group: root
compose_stack_postgres_port: 5432
# The port that OpenBao's container publishes on the host's local address. The OpenBao role reaches the server on it.
openbao_port: 8200
# The Docker socket on the host. The code location reaches it through the socket's group, which the role reads from the socket at each deploy.
compose_stack_docker_socket: /var/run/docker.sock
# The images the project makes itself, until it pushes them to a registry: the tag that the Compose files name, the name of the image's folder under
# compose_stack_directory/images, the repository's folders that the folder holds, the build context (a source, or "." for the whole folder; the first source
# when unset), the Dockerfile (in the context when unset) and the named build contexts that the Dockerfile copies from. The host builds each image and builds
# it again only when its folder changes.
compose_stack_built_images:
  - tag: surgical-risk-dagster:1.13.31
    name: dagster
    sources: [orchestration, scripts, compose, spark, tests/fixtures/vitaldb]
    build_contexts:
      stack_scripts: scripts
      stack_compose: compose
      stack_spark: spark
      stack_fixtures: tests/fixtures/vitaldb
  - tag: surgical-risk-spark:4.1.4
    name: spark
    sources: [spark, scripts, replay, features, tests/fixtures/vitaldb]
    context: "."
    dockerfile: spark/Dockerfile
  - tag: surgical-risk-replay:1.7.2
    name: replay
    sources: [replay, scripts, features, tests]
    context: "."
    dockerfile: replay/Dockerfile
# The namespace of the first commit that the deploy gives Nessie's main branch.
compose_stack_nessie_namespace: surgical_risk
# The services that start last, in the connection playbook, after the Airbyte role and the launcher's key script made the files that the code location mounts as
# Compose secrets (Airbyte writes the instance's client credentials only when it first starts, its release needs PostgreSQL, and the key arrives after the host
# playbook): the code location and every service that waits for it.
compose_stack_orchestration_services: [dagster_code_location, dagster_daemon, dagster_webserver]
# An empty project name keeps the one fixed name in compose.yml.
compose_stack_project: ""
# Each deadline is in seconds. The start deadline covers pulling the images and the health deadline each service's health check.
compose_stack_start_deadline_seconds: 900
compose_stack_health_deadline_seconds: 180
compose_stack_build_deadline_seconds: 1800
compose_stack_provision_deadline_seconds: 120
compose_stack_command:
  - docker
  - compose
  - --project-directory
  - "{{ compose_stack_compose_directory }}"
  - --file
  - "{{ compose_stack_compose_directory }}/compose.yml"
  - --env-file
  - "{{ compose_stack_compose_directory }}/limits.env"
  - --env-file
  - "{{ compose_stack_compose_directory }}/host.env"
compose_stack_docker: "{{ compose_stack_command + (['--project-name', compose_stack_project] if compose_stack_project else []) }}"

# Helm and Airbyte's chart. Each download is checked against its pinned SHA-256. Helm 3 is the line that Airbyte's installation guide uses.
helm_version: v3.22.1
helm_archive_sha256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea
helm_install_directory: /usr/local/lib/helm
airbyte_chart_version: 2.5.0
airbyte_chart_sha256: 7524c22b2338399516025de1d903176c7302170315d4ff88e9dfd11192abb029

# Airbyte on k3s. The tracked values file is placed beside two rendered files: the memory limits from the limits file and the host settings below.
airbyte_directory: /opt/platform/airbyte
airbyte_secrets_directory: "{{ compose_stack_secrets_directory }}"
airbyte_owner: root
airbyte_group: root
airbyte_namespace: airbyte
airbyte_release: airbyte
airbyte_kubeconfig: /etc/rancher/k3s/k3s.yaml
# The web service listens on the host's local address only. The forwarder maps this local port to the server service's port.
airbyte_web_port: 8000
airbyte_server_service_port: 8001
airbyte_web_unit: /etc/systemd/system/airbyte-web.service
# The pods reach the shared PostgreSQL server at the k3s bridge's address on the host, which the role reads from k3s's flannel file when it deploys. A socket on
# that address forwards to the server's local address, where PostgreSQL's published port stays. The deadline is in seconds.
airbyte_flannel_subnet_file: /run/flannel/subnet.env
airbyte_bridge_deadline_seconds: 120
airbyte_postgres_unit_directory: /etc/systemd/system
airbyte_postgres_unit: airbyte-postgres
airbyte_database_port: "{{ compose_stack_postgres_port }}"
airbyte_database_name: airbyte
airbyte_database_user: airbyte
# Temporal keeps its own two databases, owned by the same account, because the chart's database account cannot create a database.
airbyte_temporal_database: airbyte_temporal
airbyte_temporal_visibility_database: airbyte_temporal_visibility
# The size limit of the staging volume of a copy job, which holds each file on the host's disk during the copy. The job's pod is evicted when its volume passes the limit, so a
# copy stops with Kubernetes's message before the disk fills. It holds the largest file the connector may copy (1.5 GB) and is a small part of the 200 GiB disk. An estimate
# until the ingestion phase measures the peak staging use and the free space during a copy and a retry.
airbyte_staging_size: 5G
# The connectors of the raw connection, each at the newest stable version of the OSS connector registry on Nov 22 2026 that has the delivery method "Copy raw files" (source
# 4.10.1 and later), a file of up to 1.5 GB (source 4.11.0) and the sub-folders kept (source 4.12.0) and, for the destination, file transfer (1.4.0 and later).
# The digests are the linux/amd64 image digests on Docker Hub (read Nov 22 2026). Airbyte pulls a connector by its tag, so a digest is a record for the reader of
# the pin and not an input. Every connection that reads S3 takes the one pinned source definition, ``s3_source_pinned`` (scripts.ingestion.connection.source_definition),
# so all of them run this version. Change a pin only after reading the connector's changelog.
airbyte_source_s3_version: 4.17.1
airbyte_source_s3_digest: sha256:0ca33028218a3c166cf8802e2f955e285f6c167b043a36e9f300768ea4e2299b
airbyte_destination_s3_version: 1.9.11
airbyte_destination_s3_digest: sha256:877e299d77182c7cb2c833c9e4fe7ccc6849487fb1b667bc61e53d8cadb22d6f
# The project's bucket that the raw connection lands in. The deployment's variables give it, as for the workload access region; an empty value is refused.
airbyte_landing_bucket: ""
# What the connection selects: full_release (the two tables and the 6,388 case files of the pin) or fixed_sample (the development candidate cases and the two tables, a part of the
# release). Changing it repairs the source's selection and nothing else, and the files already copied stay copied.
airbyte_connection_scope: full_release
# The folder of the platform's scripts on the host, and the script that places the project profile's access key. The launcher pipes the key to it on standard input (the
# owner's exception to the short-lived rule); the key never passes through Ansible.
airbyte_bin_directory: /opt/platform/bin
airbyte_key_script: "{{ airbyte_bin_directory }}/airbyte_key_install"
# The sudoers drop-in that turns off sudo's input and output recording for the command line that runs that script, and the program that checks it before it is placed.
airbyte_key_sudoers: /etc/sudoers.d/airbyte_key_install
airbyte_visudo: /usr/sbin/visudo
# The deadline of one exchange with Airbyte's API, in seconds. Creating the connection makes Airbyte read the source's schema, which takes the longest.
airbyte_connection_deadline_seconds: 600
# The deadline of the whole connection step, in seconds: no exchange and no kubectl call runs past it.
airbyte_connection_run_seconds: 1800
# The address that the owner's browser uses, set when Caddy's Tailscale name is known. An empty value leaves the chart's setting alone.
airbyte_public_url: ""
# Each deadline is in seconds. The release deadline covers pulling the images and running the chart's database migration.
airbyte_release_deadline_seconds: 1200
airbyte_ready_deadline_seconds: 300
airbyte_health_deadline_seconds: 120
