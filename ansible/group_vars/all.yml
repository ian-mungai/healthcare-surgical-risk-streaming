# Every version is pinned. Change a pin only with its checksum, after reading the tool's release notes.
docker_signing_file_sha256: 1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
docker_packages:
  - docker-ce=5:29.9.3-1~ubuntu.24.04~noble
  - docker-ce-cli=5:29.9.3-1~ubuntu.24.04~noble
  - containerd.io=2.4.2-4~ubuntu.24.04~noble
  - docker-compose-plugin=5.8.0-1~ubuntu.24.04~noble
docker_log_max_size: 50m
docker_log_max_file: "5"

k3s_version: v1.37.2+k3s1
k3s_install_script_sha256: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b
k3s_ready_deadline_seconds: 300

# The host commands pass the region and one entry for each workload role in the run's Terraform outputs.
workload_access_region: ""
workload_access_workloads: []

# The services that may reach instance metadata, as systemd unit names in system.slice. Every other process is refused.
metadata_guard_allowed_units:
  - workload-credentials.service
  - tailscaled.service
  - tailscale-join.service
  - cloud-init-local.service
  - cloud-init.service
  - cloud-init-main.service
  - cloud-config.service
  - cloud-final.service
