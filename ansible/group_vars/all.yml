# Every version is pinned. Change a pin only with its checksum, after reading the tool's release notes.
docker_signing_file_sha256: 1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
docker_packages:
  - docker-ce=5:29.9.3-1~ubuntu.24.04~noble
  - docker-ce-cli=5:29.9.3-1~ubuntu.24.04~noble
  - containerd.io=2.4.2-4~ubuntu.24.04~noble
  - docker-compose-plugin=5.8.0-1~ubuntu.24.04~noble
docker_log_max_size: 50m
docker_log_max_file: "5"

k3s_version: v1.37.2+k3s1
k3s_install_script_sha256: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b
k3s_ready_deadline_seconds: 300

# The host commands pass the region and one entry for each workload role in the run's Terraform outputs.
workload_access_region: ""
workload_access_workloads: []

# The services that may reach instance metadata, as systemd unit names in system.slice. Every other process is refused.
metadata_guard_allowed_units:
  - workload-credentials.service
  - tailscaled.service
  - tailscale-join.service
  - cloud-init-local.service
  - cloud-init.service
  - cloud-init-main.service
  - cloud-config.service
  - cloud-final.service

# The container runtimes. Each requires the metadata guard unit, so none starts while the guard has failed to load.
metadata_guard_runtime_units:
  - docker.service
  - containerd.service
  - k3s.service

# The folder of the systemd units and their drop-ins.
metadata_guard_unit_directory: /etc/systemd/system

# The secret store's unlock key file on the host. Its owner is the user that deploys the stack.
unlock_key_directory: /opt/platform
unlock_key_file: "{{ unlock_key_directory }}/.env"
unlock_key_owner: ubuntu
unlock_key_group: ubuntu

# The Compose stack. The password files live outside the placed Compose files, in a folder that only root reads.
compose_stack_directory: /opt/platform
compose_stack_compose_directory: "{{ compose_stack_directory }}/compose"
compose_stack_secrets_directory: "{{ compose_stack_directory }}/secrets"
# One line for each tool that needs a PostgreSQL account and database.
compose_stack_tools_file: "{{ compose_stack_compose_directory }}/postgres_tools.txt"
compose_stack_owner: root
compose_stack_group: root
compose_stack_postgres_port: 5432
# An empty project name keeps the one fixed name in compose.yml.
compose_stack_project: ""
# Each deadline is in seconds. The start deadline covers pulling the images and the health deadline each service's health check.
compose_stack_start_deadline_seconds: 900
compose_stack_health_deadline_seconds: 180
compose_stack_provision_deadline_seconds: 120
compose_stack_command:
  - docker
  - compose
  - --project-directory
  - "{{ compose_stack_compose_directory }}"
  - --file
  - "{{ compose_stack_compose_directory }}/compose.yml"
  - --env-file
  - "{{ compose_stack_compose_directory }}/limits.env"
  - --env-file
  - "{{ compose_stack_compose_directory }}/host.env"
compose_stack_docker: "{{ compose_stack_command + (['--project-name', compose_stack_project] if compose_stack_project else []) }}"
