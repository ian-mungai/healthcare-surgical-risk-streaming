# The second run of the host deployment, after the host playbook and the placement of the project profile's access key (scripts.infra.host). It makes the raw
# connection of the release copy in Airbyte. The module reads the two key files on the host; no Ansible variable, fact or argument holds the key.
- name: Make the raw connection of the release copy
  hosts: platform
  become: true
  gather_facts: false

  tasks:
    - name: Make the raw connection in Airbyte
      ansible.builtin.include_role:
        name: airbyte
        tasks_from: connection.yml
