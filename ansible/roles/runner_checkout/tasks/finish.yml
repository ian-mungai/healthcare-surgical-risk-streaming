# Reads runner_checkout_folder, runner_checkout_commit, runner_checkout_manifest, runner_checkout_manifest_mode, runner_checkout_marker, runner_checkout_marker_text,
# runner_checkout_owner, runner_checkout_group, runner_checkout_file_mode and runner_checkout_archive_files. Closes the folder, writes the source manifest from the files that the
# controller read (and fails if the unpacked folder holds anything else; before any runner is placed, and read-only to its owner), checks the folder, and writes the marker
# last, so a folder with a marker is a finished one and a failed deploy leaves a folder that the next run removes. A link is not followed: the environment's interpreter link
# leads to the shared interpreter, which stays as it is. The owner, group and permission changes run under a deadline.
- name: Give every entry of the folder to the owner and group without following a link
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ runner_checkout_kill_after_seconds }}"
      - "{{ runner_checkout_close_deadline_seconds }}"
      - chown
      - -R
      - -h
      - "{{ runner_checkout_owner }}:{{ runner_checkout_group }}"
      - "{{ runner_checkout_folder }}"
  changed_when: true
  timeout: "{{ runner_checkout_close_deadline_seconds + runner_checkout_stop_grace_seconds }}"

- name: Close every entry of the folder to everyone but its owner and group
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ runner_checkout_kill_after_seconds }}"
      - "{{ runner_checkout_close_deadline_seconds }}"
      - chmod
      - -R
      - "{{ runner_checkout_file_mode }}"
      - "{{ runner_checkout_folder }}"
  changed_when: true
  timeout: "{{ runner_checkout_close_deadline_seconds + runner_checkout_stop_grace_seconds }}"

- name: Write the source manifest of the files that the controller read in the archive
  runner_manifest:
    state: write
    folder: "{{ runner_checkout_folder }}"
    commit: "{{ runner_checkout_commit }}"
    files: "{{ runner_checkout_archive_files }}"
    owner: "{{ runner_checkout_owner }}"
    group: "{{ runner_checkout_group }}"
    mode: "{{ runner_checkout_manifest_mode }}"
  timeout: "{{ runner_checkout_manifest_deadline_seconds }}"

- name: List every entry of the folder without following a link
  ansible.builtin.find:
    paths: "{{ runner_checkout_folder }}"
    file_type: any
    recurse: true
    hidden: true
    follow: false
  register: runner_checkout_entries
  timeout: "{{ runner_checkout_scan_deadline_seconds }}"

- name: Look at the folder itself and the Git folder
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ runner_checkout_folder }}"
    - "{{ runner_checkout_folder }}/.git"
    - "{{ runner_checkout_manifest }}"
  register: runner_checkout_roots

- name: Refuse a folder that others can reach, that another user owns or that holds Git history
  ansible.builtin.assert:
    that:
      - runner_checkout_entries.files | rejectattr('islnk') | rejectattr('mode', 'search', '0$') | list | length == 0
      - runner_checkout_entries.files | rejectattr('islnk') | rejectattr('pw_name', 'equalto', runner_checkout_owner) | list | length == 0
      - runner_checkout_roots.results[0].stat.mode is regex('^0?[0-7][0-5]0$')
      - not runner_checkout_roots.results[1].stat.exists
      - runner_checkout_roots.results[2].stat.isreg | default(false)
      - runner_checkout_roots.results[2].stat.mode is regex('^0?400$')
    quiet: true
    fail_msg: the runner folder is open to other users, is not owned by the deploy user, holds a .git folder, or has no source manifest that only its owner reads

- name: Write the marker that says the folder is finished
  ansible.builtin.copy:
    dest: "{{ runner_checkout_marker }}"
    content: "{{ runner_checkout_marker_text }}"
    owner: "{{ runner_checkout_owner }}"
    group: "{{ runner_checkout_group }}"
    mode: "0640"
