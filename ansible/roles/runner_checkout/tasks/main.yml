# Places the deployed commit's code and a pinned Python environment in one folder for the native host-mode runners, and nothing else. The order: refuse a commit or pin of the
# wrong form; read the commit's archive on the controller (git archive, no Git history: its files and hashes are the only expected files, and a commit or a link that the
# repository cannot give fails the deploy here, before anything on the host changes); install the pinned interpreter once (a folder of its own named for its version, beside
# the others of this host, published by one atomic replacement of the link that names it, only after it ran and said its version); decide whether this commit's folder is
# finished (real folders, its marker, every file of the controller's archive, and an environment that holds exactly the lock files); and only when it is not, make sure that no
# process of an earlier build works, remove every other folder under the runner folder and the unfinished one, place the code, build the environment from the hash-pinned
# requirements, close the folder to everyone but its owner and its group, check that, and write the finished marker last. The marker names the commit, the interpreter pin and
# the requirements, so a second run of the same commit changes nothing and keeps the runner files that the launcher placed there, and a new commit, a new interpreter pin or
# an unfinished folder replaces the folder. Every command runs under timeout with a kill-after, so a command that never ends is stopped, with its processes, where it runs. The
# role reads no Compose, Docker, Kubernetes or secret setting and writes outside its own two folders, the interpreter archive's folder and the record of build processes never.
- name: Refuse a commit, an interpreter pin or a requirements file of the wrong form
  ansible.builtin.assert:
    that:
      - runner_checkout_commit is regex('^[0-9a-f]{40}$')
      - runner_checkout_python_version is regex('^3\.[0-9]+\.[0-9]+$')
      - runner_checkout_python_archive_sha256 is regex('^[0-9a-f]{64}$')
      - runner_checkout_requirements | length > 0
      - runner_checkout_requirements | reject('regex', '^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*$') | list | length == 0
    quiet: true
    fail_msg: the commit must be 40 lowercase hexadecimal digits, the interpreter pin an exact version with a SHA-256 and each requirements file a plain relative path

- name: Read the commit's archive on the controller, install the interpreter, decide whether the folder is finished and place it when it is not
  block:
    - name: Make the commit's archive on the controller and read its files, before anything on the host changes
      ansible.builtin.include_tasks: source.yml

    - name: Install the pinned interpreter
      ansible.builtin.include_tasks: python.yml

    - name: Decide whether this commit's folder is finished
      ansible.builtin.include_tasks: folders.yml

    - name: Place the commit's code and build the environment
      ansible.builtin.include_tasks: archive.yml
      when: not runner_checkout_complete

    - name: Check the finished folder and write its marker
      ansible.builtin.include_tasks: finish.yml
      when: not runner_checkout_complete
  always:
    - name: Remove the controller's scratch folder
      ansible.builtin.command:
        argv: [timeout, "--kill-after={{ runner_checkout_kill_after_seconds }}", "{{ runner_checkout_remove_deadline_seconds }}", rm, -rf, --, "{{ runner_checkout_scratch.path }}"]
      delegate_to: localhost
      become: false
      changed_when: false
      when: runner_checkout_scratch is defined and runner_checkout_scratch.path is defined
      timeout: "{{ runner_checkout_remove_deadline_seconds + runner_checkout_stop_grace_seconds }}"
