# Reads compose_stack_docker, compose_stack_aistor_service, compose_stack_aistor_project_user, compose_stack_aistor_project_policy, compose_stack_aistor_project_password_file,
# compose_stack_aistor_openbao_path, compose_stack_aistor_rotate_password, compose_stack_secrets_directory, openbao_port and aistor_bucket (the launcher gives the bucket).
# The project user signs in as itself with the sign-in that OpenBao keeps, so a deploy that matches makes no call with AIStor's root pair and no write. Only a refused
# sign-in or a changed policy sends the step to the root pair, which the module's script reads inside the AIStor container from the container's own secrets mount.
# OpenBao is logged in to as the bootstrap role, whose secret ID file is root-only on the host, and is written with the sign-in only after that pair has signed in.
# The task is hidden, so neither password reaches a log.
- name: Verify the AIStor project user as itself, and make its user and policy with the root pair that the server's container reads only when that fails
  aistor_project_user:
    compose_command: "{{ compose_stack_docker }}"
    service: "{{ compose_stack_aistor_service }}"
    user: "{{ compose_stack_aistor_project_user }}"
    policy: "{{ compose_stack_aistor_project_policy }}"
    bucket: "{{ aistor_bucket }}"
    password_file: "{{ compose_stack_aistor_project_password_file }}"
    openbao_address: "http://127.0.0.1:{{ openbao_port }}"
    openbao_secret_id_file: "{{ compose_stack_secrets_directory }}/openbao/bootstrap.secret_id"
    openbao_path: "{{ compose_stack_aistor_openbao_path }}"
    rotate: "{{ compose_stack_aistor_rotate_password }}"
  timeout: 300
  no_log: true
