# Reads compose_stack_secrets_directory and grafana_user. The owner is compared by number. File content is never read.
- name: Read the status of the Grafana administrator password file
  ansible.builtin.stat:
    path: "{{ compose_stack_secrets_directory }}/grafana/admin.password"
  register: compose_stack_grafana_status

- name: Confirm the Grafana password file is for the Grafana user and for nobody else
  ansible.builtin.assert:
    that:
      - compose_stack_grafana_status.stat.exists
      - compose_stack_grafana_status.stat.isreg
      - compose_stack_grafana_status.stat.mode == '0400'
      - compose_stack_grafana_status.stat.uid == (grafana_user.split(':')[0] | int)
      - compose_stack_grafana_status.stat.gid == (grafana_user.split(':')[1] | int)
    fail_msg: "The Grafana password file is missing, is readable by anyone but its owner, can be written or belongs to another user than the Grafana container."
