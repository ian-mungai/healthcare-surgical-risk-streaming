# Deploys the Compose stack. A service that needs its own database account cannot become healthy before the account exists, so the order is: place the
# Compose files, write the gateway's settings, render the limits and host settings, create the password files and check them, create the Grafana password
# file, build the images the project makes itself, start PostgreSQL alone and wait for it, make the PostgreSQL accounts match the tool list, prepare the
# secret store's first start, start the remaining services and wait for them, give Nessie's main branch its first commit, make the Kafka topics and the
# registry's rules match their lists, and make the secret store match the service list. A second run changes nothing.
- name: Place the Compose files
  ansible.builtin.include_tasks: place_files.yml

- name: Write the settings the gateway reads
  ansible.builtin.include_tasks: caddy_host.yml

- name: Render the memory limits and the host settings
  ansible.builtin.include_tasks: render_environment.yml

- name: Create the missing password files
  ansible.builtin.include_tasks: passwords.yml

- name: Check the password files
  ansible.builtin.include_tasks: verify_secrets.yml

- name: Create the Grafana password file
  ansible.builtin.include_tasks: grafana_password.yml

- name: Build the images the project makes itself
  ansible.builtin.include_tasks: build_images.yml

- name: Start PostgreSQL and wait for its health
  ansible.builtin.include_tasks: start.yml
  vars:
    compose_stack_start_services: [postgres]

- name: Make the PostgreSQL accounts match the tool list
  ansible.builtin.include_tasks: provision.yml

- name: Prepare the secret store's first start
  ansible.builtin.include_role:
    name: openbao
    tasks_from: prepare.yml

- name: Start the remaining services and wait for their health
  ansible.builtin.include_tasks: start.yml
  vars:
    compose_stack_start_services: []

- name: Give Nessie's main branch its first commit
  ansible.builtin.include_tasks: nessie.yml

- name: Make the Kafka topics match the topic list
  ansible.builtin.include_tasks: kafka.yml

- name: Make the registry's compatibility rules match the rule list
  ansible.builtin.include_tasks: registry.yml

- name: Make the secret store match the service list
  ansible.builtin.include_role:
    name: openbao
    tasks_from: bootstrap.yml
