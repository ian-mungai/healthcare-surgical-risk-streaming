# Reads compose_stack_aistor_licence_file and compose_stack_owner, and sets compose_stack_aistor_licence_present. The licence is placed by the launcher (scripts.infra.host),
# which reads it from the owner's OpenBao: one file on the host that only compose_stack_owner reads (mode 0400). A file that is missing is no failure: the fact is
# false and the AIStor step skips AIStor. The step never creates the file and never prints its content, and it makes no checksum of it. Its content is not read into
# a variable: a search for a line with any character that is not white space answers by its exit status only. A file that is there and is empty, white space only,
# not a plain file, of another owner or of any other mode stops the deploy with one fixed message, so a licence that was placed badly is never taken for an absent one.
- name: Check the AIStor licence file
  vars:
    compose_stack_aistor_licence_message: >-
      the AIStor licence file is empty or is not a plain file that only {{ compose_stack_owner }} reads (mode 0400): place the licence key at
      compose_stack_aistor_licence_file
  block:
    - name: Stop when the licence file is not named
      ansible.builtin.assert:
        that: compose_stack_aistor_licence_file | default('') | length > 0
        quiet: true
        fail_msg: "the AIStor licence file is not named: set compose_stack_aistor_licence_file"

    - name: Look at the licence file
      ansible.builtin.stat:
        path: "{{ compose_stack_aistor_licence_file }}"
        follow: false
        get_checksum: false
        get_mime: false
      register: compose_stack_aistor_licence_stat

    - name: Find whether the licence file is there
      ansible.builtin.set_fact:
        compose_stack_aistor_licence_present: "{{ compose_stack_aistor_licence_stat.stat.exists }}"

    - name: Stop when the licence file is not a plain file or is readable by anyone but its owner
      ansible.builtin.assert:
        that:
          - compose_stack_aistor_licence_stat.stat.isreg | default(false)
          - compose_stack_aistor_licence_stat.stat.pw_name | default('') == compose_stack_owner
          - compose_stack_aistor_licence_stat.stat.mode | default('') == '0400'
        quiet: true
        fail_msg: "{{ compose_stack_aistor_licence_message }}"
      when: compose_stack_aistor_licence_present

    - name: Look for a character in the licence file that is not white space, by exit status only
      ansible.builtin.command:
        argv: [grep, --quiet, --extended-regexp, '[^[:space:]]', "{{ compose_stack_aistor_licence_file }}"]
      register: compose_stack_aistor_licence_text
      changed_when: false
      failed_when: false
      check_mode: false
      timeout: 30
      when: compose_stack_aistor_licence_present

    - name: Stop when the licence file holds only white space
      ansible.builtin.assert:
        that: compose_stack_aistor_licence_text.rc == 0
        quiet: true
        fail_msg: "{{ compose_stack_aistor_licence_message }}"
      when: compose_stack_aistor_licence_present
