# Reads compose_stack_tools_file and compose_stack_secrets_directory. The module creates only missing files and prints no password.
- name: Create the missing password files of the server and of each tool
  postgres_accounts:
    step: passwords
    tools_file: "{{ compose_stack_tools_file }}"
    secrets_directory: "{{ compose_stack_secrets_directory }}"
  register: compose_stack_passwords

- name: Remember the accounts that have a password file
  ansible.builtin.set_fact:
    compose_stack_accounts: "{{ compose_stack_passwords.accounts }}"
