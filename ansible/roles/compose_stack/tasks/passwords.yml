# Reads compose_stack_tools_file, compose_stack_services_file, compose_stack_secrets_directory and secret_files_root_owner. The module creates only missing files,
# gives each file its owner and mode 0400 and prints no password.
- name: Create the missing password files of the server and of each tool and give each its owner
  postgres_accounts:
    step: passwords
    tools_file: "{{ compose_stack_tools_file }}"
    services_file: "{{ compose_stack_services_file }}"
    secrets_directory: "{{ compose_stack_secrets_directory }}"
    root_owner: "{{ secret_files_root_owner }}"
  register: compose_stack_passwords

- name: Remember the accounts that have a password file and the owner of each
  ansible.builtin.set_fact:
    compose_stack_accounts: "{{ compose_stack_passwords.accounts }}"
    compose_stack_owners: "{{ compose_stack_passwords.owners }}"
