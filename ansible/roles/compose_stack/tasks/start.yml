# Reads compose_stack_docker, compose_stack_start_services (the services to start; none named starts every service) and the deadlines. A service whose
# placed configuration file is newer than its container is recreated alone, because Compose compares no file content. Every wait ends at
# its deadline and a failure names the service and holds no secret. The containers are read through the first word of compose_stack_docker, the docker command.
- name: Read the stack's containers before the start
  ansible.builtin.command:
    argv: "{{ compose_stack_docker + ['ps', '--all', '--quiet'] }}"
  register: compose_stack_before
  changed_when: false
  check_mode: false
  timeout: 60

- name: Read how long each container has run before the start
  ansible.builtin.command:
    argv: "{{ [compose_stack_docker[0], 'inspect', '--format', '{{ .Id }} {{ .State.StartedAt }}'] + compose_stack_before.stdout_lines }}"
  register: compose_stack_started_before
  changed_when: false
  check_mode: false
  when: compose_stack_before.stdout_lines | length > 0
  timeout: 60

- name: Read which services run with an older copy of a placed configuration file
  stale_services:
    compose_command: "{{ compose_stack_docker }}"
  register: compose_stack_stale
  check_mode: false
  timeout: 60

- name: Start the services and wait for every health check
  block:
    - name: Start the services
      ansible.builtin.command:
        argv: "{{ compose_stack_docker + ['up', '--detach', '--wait', '--wait-timeout', compose_stack_health_deadline_seconds | string] + (compose_stack_start_services | default([])) }}"
      register: compose_stack_up
      changed_when: false
      timeout: "{{ compose_stack_start_deadline_seconds | int }}"
  rescue:
    - name: Read each service's state without logs
      ansible.builtin.command:
        argv: "{{ compose_stack_docker + ['ps', '--all', '--format', 'table {{ .Service }}\\t{{ .State }}\\t{{ .Status }}'] }}"
      register: compose_stack_diagnosis
      changed_when: false
      failed_when: false
      timeout: 60

    - name: Stop with the service and its state
      ansible.builtin.fail:
        msg: >-
          The services did not become healthy within {{ compose_stack_health_deadline_seconds }} seconds (start deadline {{ compose_stack_start_deadline_seconds }}
          seconds). State of each service: {{ compose_stack_diagnosis.stdout | default('unreadable') }}

- name: Recreate the services that run with an older copy of a configuration file, each without its dependencies
  ansible.builtin.command:
    argv: >-
      {{ compose_stack_docker + ['up', '--detach', '--wait', '--wait-timeout', compose_stack_health_deadline_seconds | string, '--force-recreate', '--no-deps']
      + compose_stack_recreated }}
  vars:
    compose_stack_recreated: "{{ compose_stack_stale.stale if not (compose_stack_start_services | default([])) else compose_stack_stale.stale | select('in', compose_stack_start_services) | list }}"
  when: compose_stack_recreated | length > 0
  changed_when: false
  timeout: "{{ compose_stack_start_deadline_seconds | int }}"

- name: Read the stack's containers after the start
  ansible.builtin.command:
    argv: "{{ compose_stack_docker + ['ps', '--all', '--quiet'] }}"
  register: compose_stack_after
  changed_when: false
  check_mode: false
  timeout: 60

- name: Read how long each container has run after the start
  ansible.builtin.command:
    argv: "{{ [compose_stack_docker[0], 'inspect', '--format', '{{ .Id }} {{ .State.StartedAt }}'] + compose_stack_after.stdout_lines }}"
  register: compose_stack_started_after
  changed_when: compose_stack_started_before.stdout_lines | default([]) | sort != compose_stack_started_after.stdout_lines | sort
  check_mode: false
  timeout: 60
