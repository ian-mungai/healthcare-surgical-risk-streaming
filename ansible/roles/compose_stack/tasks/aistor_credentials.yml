# Reads compose_stack_secrets_directory and secret_files_root_owner (the AIStor server runs as root). A missing file is created with a random value for root with
# mode 0400, and an existing one keeps its value and is given that owner and mode. No value is printed. The root pair is read by the server alone, through
# MINIO_ROOT_USER_FILE and MINIO_ROOT_PASSWORD_FILE. The third and fourth files, project_password and audit_password, are the passwords that
# aistor_project_user.yml gives the project user and the read-only audit identity when it makes them with the root pair on the first bootstrap, and the ones that
# it keeps in OpenBao after each pair has signed in: nothing but that step reads the files. A file that is lost and made again never replaces what OpenBao keeps
# while the kept pair signs in.
- name: Create each missing AIStor credential file for root
  secret_file:
    path: "{{ compose_stack_secrets_directory }}/aistor/{{ item }}"
    owner: "{{ secret_files_root_owner }}"
    refuse_edge_whitespace: true
  loop: [root_user, root_password, project_password, audit_password]
  loop_control:
    label: "{{ item }}"
  no_log: true

- name: Check the AIStor credential files
  ansible.builtin.include_tasks: verify_aistor_credentials.yml
