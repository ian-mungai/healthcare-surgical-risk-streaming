# Reads compose_stack_secrets_directory and secret_files_root_owner (the AIStor server runs as root). A missing file is created with a random value for root with
# mode 0400, and an existing one keeps its value and is given that owner and mode. No value is printed. The root pair is read by the server alone, through
# MINIO_ROOT_USER_FILE and MINIO_ROOT_PASSWORD_FILE. The third file, project_password, is the password of the project user that aistor_project_user.yml makes with
# the root pair once; the OpenBao step then keeps it at the aistor service's own path, and nothing but those two steps reads the file.
# The secrets that OpenBao is to keep for generated secrets are another branch's work, and this step then moves.
- name: Create each missing AIStor credential file for root
  secret_file:
    path: "{{ compose_stack_secrets_directory }}/aistor/{{ item }}"
    owner: "{{ secret_files_root_owner }}"
    refuse_edge_whitespace: true
  loop: [root_user, root_password, project_password]
  loop_control:
    label: "{{ item }}"
  no_log: true

- name: Check the AIStor credential files
  ansible.builtin.include_tasks: verify_aistor_credentials.yml
