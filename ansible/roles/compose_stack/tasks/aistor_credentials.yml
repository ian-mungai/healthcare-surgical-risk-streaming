# Reads compose_stack_secrets_directory and secret_files_root_owner (the AIStor server runs as root). A missing file is created with a random value for root with
# mode 0400, and an existing one keeps its value and is given that owner and mode. No value is printed. The generated-secret pattern of the Grafana password (the
# secret_file module) is used as it is today: the secrets that OpenBao is to keep for generated secrets are another branch's work, and this step then moves.
- name: Create each missing AIStor root credential file for root
  secret_file:
    path: "{{ compose_stack_secrets_directory }}/aistor/{{ item }}"
    owner: "{{ secret_files_root_owner }}"
    refuse_edge_whitespace: true
  loop: [root_user, root_password]
  loop_control:
    label: "{{ item }}"
  no_log: true

- name: Check the AIStor root credential files
  ansible.builtin.include_tasks: verify_aistor_credentials.yml
