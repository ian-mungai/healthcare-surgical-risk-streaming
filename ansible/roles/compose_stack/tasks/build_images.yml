# Reads compose_stack_directory, compose_stack_built_images, compose_stack_docker (its first word is the docker command), compose_stack_build_deadline_seconds,
# compose_stack_owner and compose_stack_group, and compose_stack_source_root (default: the repository's root). Until the project pushes its images to a registry,
# the host builds them. Each image has its own folder under images/ on the host, which holds a copy of each of its sources. A source is a path relative to the
# repository's root and keeps that path in the image's folder: a top-level folder lands at images/<name>/<folder>, and tests/fixtures/vitaldb lands at
# images/<name>/tests/fixtures/vitaldb, so a Dockerfile copies it from the path that the repository has. The build context is that folder or one source in it, the
# Dockerfile and the named build contexts are sources in it too, and an image is built only when the folder differs from the one the image was built from: the
# image carries the hash of the whole folder as a label, so a change in a named context builds the image again.
# Every source is checked before anything is staged: it must be a plain relative path (no leading slash, no "..", no empty or "." part), it must exist, and neither
# it nor anything in it may be a symbolic link, because the copy would follow the link out of the repository.
- name: Refuse a source that is not a plain relative path
  ansible.builtin.assert:
    that: item.1 is regex('^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*$') and '..' not in item.1.split('/')
    quiet: true
    fail_msg: "{{ item.0.tag }}: the source {{ item.1 | to_json }} is not a plain relative path inside the repository"
  loop: "{{ compose_stack_built_images | subelements('sources') }}"
  loop_control:
    label: "{{ item.0.tag }}: {{ item.1 }}"

- name: Look at each source in the repository
  ansible.builtin.stat:
    path: "{{ [compose_stack_source_root | default(role_path ~ '/../../..'), item.1] | path_join }}"
    follow: false
  register: compose_stack_source_stats
  delegate_to: localhost
  become: false
  loop: "{{ compose_stack_built_images | subelements('sources') }}"
  loop_control:
    label: "{{ item.0.tag }}: {{ item.1 }}"

- name: List the symbolic links inside each source
  ansible.builtin.find:
    paths: "{{ [compose_stack_source_root | default(role_path ~ '/../../..'), item.1] | path_join }}"
    file_type: link
    recurse: true
    hidden: true
    follow: false
  register: compose_stack_source_links
  delegate_to: localhost
  become: false
  when: compose_stack_source_stats.results[ansible_loop.index0].stat.isdir | default(false)
  loop: "{{ compose_stack_built_images | subelements('sources') }}"
  loop_control:
    label: "{{ item.0.tag }}: {{ item.1 }}"
    extended: true

- name: Refuse a source that is missing, is a symbolic link or holds one
  ansible.builtin.assert:
    that:
      - compose_stack_source_stats.results[ansible_loop.index0].stat.exists
      - not (compose_stack_source_stats.results[ansible_loop.index0].stat.islnk | default(false))
      - (compose_stack_source_links.results[ansible_loop.index0].files | default([])) | length == 0
    quiet: true
    fail_msg: >-
      {{ item.0.tag }}: the source {{ item.1 }} is missing, is a symbolic link or holds a symbolic link
      (the copy would follow it out of the repository)
  loop: "{{ compose_stack_built_images | subelements('sources') }}"
  loop_control:
    label: "{{ item.0.tag }}: {{ item.1 }}"
    extended: true

- name: Create the folder of each image the project makes itself
  ansible.builtin.file:
    path: "{{ compose_stack_directory }}/images/{{ item.name }}"
    state: directory
    owner: "{{ compose_stack_owner }}"
    group: "{{ compose_stack_group }}"
    mode: "0755"
  loop: "{{ compose_stack_built_images }}"
  loop_control:
    label: "{{ item.tag }}"

- name: Create the folder that each source goes into
  ansible.builtin.file:
    path: "{{ [compose_stack_directory, 'images', item.0.name, item.1 | dirname] | path_join }}"
    state: directory
    owner: "{{ compose_stack_owner }}"
    group: "{{ compose_stack_group }}"
    mode: "0755"
  loop: "{{ compose_stack_built_images | subelements('sources') }}"
  loop_control:
    label: "{{ item.0.tag }}: {{ item.1 }}"

- name: Place each source of each image at its path relative to the repository
  ansible.builtin.copy:
    src: "{{ [compose_stack_source_root | default(role_path ~ '/../../..'), item.1] | path_join }}"
    dest: "{{ [compose_stack_directory, 'images', item.0.name, item.1 | dirname] | path_join }}/"
    owner: "{{ compose_stack_owner }}"
    group: "{{ compose_stack_group }}"
    mode: preserve
    directory_mode: "0755"
    local_follow: false
  loop: "{{ compose_stack_built_images | subelements('sources') }}"
  loop_control:
    label: "{{ item.0.tag }}: {{ item.1 | basename }}"

- name: List the files of each image's folder
  ansible.builtin.find:
    paths: "{{ compose_stack_directory }}/images/{{ item.name }}"
    recurse: true
    hidden: true
    file_type: file
    get_checksum: true
  register: compose_stack_context_files
  loop: "{{ compose_stack_built_images }}"
  loop_control:
    label: "{{ item.tag }}"

- name: Read the hash of the folder that each image was built from
  ansible.builtin.command:
    argv: "{{ [compose_stack_docker[0], 'image', 'inspect', '--format', '{{ index .Config.Labels \"surgical-risk.context\" }}', item.tag] }}"
  register: compose_stack_image_labels
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ compose_stack_built_images }}"
  loop_control:
    label: "{{ item.tag }}"
  timeout: 60

- name: Build each image whose folder differs from the one it was built from, or that does not exist
  ansible.builtin.command:
    argv: "{{ build_start + file_arguments + context_arguments + [image_folder ~ ('' if context == '.' else '/' ~ context)] }}"
  vars:
    image: "{{ item.item }}"
    image_folder: "{{ compose_stack_directory }}/images/{{ image.name }}"
    context: "{{ image.context | default(image.sources[0]) }}"
    contexts: "{{ image.build_contexts | default({}) | dict2items }}"
    context_files: "{{ item.files | sort(attribute='path') }}"
    context_hash: "{{ (context_files | map(attribute='path') | zip(context_files | map(attribute='checksum'), context_files | map(attribute='mode')) | list | to_json) | hash('sha256') }}"
    build_start: "{{ [compose_stack_docker[0], 'build', '--platform', 'linux/amd64', '--tag', image.tag, '--label', 'surgical-risk.context=' ~ context_hash] }}"
    file_arguments: "{{ ['--file=' ~ image_folder ~ '/' ~ image.dockerfile] if image.dockerfile is defined else [] }}"
    context_arguments: >-
      {{ contexts | map(attribute='key') | zip(contexts | map(attribute='value')) | map('join', '=' ~ image_folder ~ '/') | map('regex_replace', '^', '--build-context=')
      | list }}
    image_label: "{{ compose_stack_image_labels.results[ansible_loop.index0].stdout | default('') | trim }}"
  when: compose_stack_image_labels.results[ansible_loop.index0].rc != 0 or image_label != context_hash
  loop: "{{ compose_stack_context_files.results }}"
  loop_control:
    label: "{{ item.item.tag }}"
    extended: true
  async: "{{ compose_stack_build_deadline_seconds | int }}"
  poll: 2
