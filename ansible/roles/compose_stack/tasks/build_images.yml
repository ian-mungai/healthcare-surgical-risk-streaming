# Reads compose_stack_directory, compose_stack_built_images, compose_stack_docker (its first word is the docker command), compose_stack_build_deadline_seconds,
# compose_stack_owner and compose_stack_group. Until the project pushes its images to a registry, the host builds them. The build context is placed on the host,
# and an image is built only when the context differs from the one the image was built from: the image carries the hash of its context as a label.
- name: Place the build context of each image the project makes itself
  ansible.builtin.copy:
    src: "{{ [role_path ~ '/../../..', item.context] | path_join }}/"
    dest: "{{ compose_stack_directory }}/{{ item.context | basename }}/"
    owner: "{{ compose_stack_owner }}"
    group: "{{ compose_stack_group }}"
    mode: preserve
    directory_mode: "0755"
  loop: "{{ compose_stack_built_images }}"
  loop_control:
    label: "{{ item.tag }}"

- name: List the files of each build context
  ansible.builtin.find:
    paths: "{{ compose_stack_directory }}/{{ item.context | basename }}"
    recurse: true
    hidden: true
    file_type: file
    get_checksum: true
  register: compose_stack_context_files
  loop: "{{ compose_stack_built_images }}"
  loop_control:
    label: "{{ item.tag }}"

- name: Read the hash of the context that each image was built from
  ansible.builtin.command:
    argv: "{{ [compose_stack_docker[0], 'image', 'inspect', '--format', '{{ index .Config.Labels \"surgical-risk.context\" }}', item.tag] }}"
  register: compose_stack_image_labels
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ compose_stack_built_images }}"
  loop_control:
    label: "{{ item.tag }}"
  timeout: 60

- name: Build each image whose context differs from the one it was built from, or that does not exist
  ansible.builtin.command:
    argv:
      - "{{ compose_stack_docker[0] }}"
      - build
      - --platform
      - linux/amd64
      - --tag
      - "{{ item.item.tag }}"
      - --label
      - "surgical-risk.context={{ context_hash }}"
      - "{{ compose_stack_directory }}/{{ item.item.context | basename }}"
  vars:
    context_files: "{{ item.files | sort(attribute='path') }}"
    context_hash: "{{ (context_files | map(attribute='path') | zip(context_files | map(attribute='checksum'), context_files | map(attribute='mode')) | list | to_json) | hash('sha256') }}"
    image_label: "{{ compose_stack_image_labels.results[ansible_loop.index0].stdout | default('') | trim }}"
  when: compose_stack_image_labels.results[ansible_loop.index0].rc != 0 or image_label != context_hash
  loop: "{{ compose_stack_context_files.results }}"
  loop_control:
    label: "{{ item.item.tag }}"
    extended: true
  async: "{{ compose_stack_build_deadline_seconds | int }}"
  poll: 2
