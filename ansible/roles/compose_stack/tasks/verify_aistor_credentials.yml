# Reads compose_stack_secrets_directory and secret_files_root_owner. The owner is compared by number and a link is not followed. File content is never read.
- name: Read the status of each AIStor credential file
  ansible.builtin.stat:
    path: "{{ compose_stack_secrets_directory }}/aistor/{{ item }}"
    follow: false
  register: compose_stack_aistor_credential_status
  loop: [root_user, root_password, project_password]
  loop_control:
    label: "{{ item }}"

- name: Confirm each AIStor credential file is a plain file with content that root alone reads
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg | default(false)
      - item.stat.size | default(0) | int > 0
      - item.stat.mode == '0400'
      - item.stat.uid == (secret_files_root_owner.split(':')[0] | int)
      - item.stat.gid == (secret_files_root_owner.split(':')[1] | int)
    quiet: true
    fail_msg: "The AIStor credential file {{ item.item }} is missing, is empty, is not a plain file, is readable by anyone but root or can be written."
  loop: "{{ compose_stack_aistor_credential_status.results }}"
  loop_control:
    label: "{{ item.item }}"
