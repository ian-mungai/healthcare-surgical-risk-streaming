# Reads compose_stack_docker (the Compose command, which runs with the project image settings removed from its environment), compose_stack_registry_user,
# compose_stack_registry_config_directory (the parent of the pull's login folder), compose_stack_owner and
# compose_stack_pull_deadline_seconds. The project's images are in one private Docker Hub repository, which the owner's computer pushed to (make images-push) and
# which compose/image_pins.yml names by digest. The host builds nothing: it pulls every image that the Compose files name (including the batch profile's).
# The role owns every piece of Docker state that the pull uses and changes no state that anything else shares: it runs no docker login and no docker logout. One shell
# task (run by bash, which makes a process group for a background job with no terminal) makes a fresh folder under the parent (mode 0700, never removed, never changed), writes the folder's
# config.json (mode 0600) with the one auth entry for Docker Hub, checks what it wrote, runs the pull in a process group of its own with DOCKER_CONFIG set to that folder and
# with DOCKER_AUTH_CONFIG and the project image settings removed from the environment, and removes that folder on every exit. A docker-credential-* program on the PATH does not
# stop the deploy: Docker looks for a default helper only when the config file holds no auth entry, and this file holds one and no credsStore or credHelpers key. The task
# reads the file's raw bytes back before the pull (bash's read with an empty delimiter stops at a NUL byte, which a command substitution would drop) and refuses unless they are exactly
# the one auth entry and a newline (the auth value is base64 text only), so no NUL, no other byte and no other key can reach Docker. The token is kept in the host's
# OpenBao, where the launcher's intake stored it (compose/external_secrets.txt: dockerhub_read, for the consumer deploy). Just before the pull, the deploy consumer's own login
# to OpenBao reads it into one hidden result (the openbao role's read_external.yml), and the shell task takes it on its standard input. No file holds it: it is on no command
# line, in no environment, in no printed output and in no variable but that one hidden result, which lives in the play's memory only. The minimum-timeout check comes before
# that read, so a refused timeout makes no OpenBao call.
# The task keeps its own deadline, compose_stack_pull_reserve_seconds before compose_stack_pull_deadline_seconds (the task's Ansible timeout), and refuses a timeout that is not
# longer than the reserve. At the deadline it sends TERM to the pull's process group, waits up to the grace, sends KILL to the group, waits up to compose_stack_pull_reap_seconds
# for the group to be gone, and only then removes the folder, then fails and names the deadline. Every wait polls once a second and runs up to one second over, so the
# worst end is the deadline plus the grace plus the reap wait plus three seconds. Ansible's timeout does not clean up for the task, so that end must come before it: the
# reserve keeps at least four seconds beyond it (tests/fast/test_pull_images_budget.py works this out from this file). The cleanup runs once (a guard flag) and ignores
# HUP, INT and TERM while it runs. A watchdog, a job in a process group of its own, outlives a shell that is killed: when the shell is gone it does the same cleanup,
# so no pull and no login file stays behind.
# The cleanup removes the login folder only when the pull's group is gone. If the group is still there after KILL and the reap wait, the cleanup keeps the folder, keeps the
# watchdog (which tries the same cleanup once more when the shell is gone), prints a fixed refusal and exits with status 65; a failed removal of the folder does the same
# with its own fixed message. The refusal texts hold no folder path and no token.
# Accepted limits (owner, Nov 25 2026): if the machine reboots, or the shell dies in the instant between starting the pull and starting its watchdog, the pull and its
# login folder can survive. The folder is a root-only (0700) folder that holds one read-only token.
- name: Stop when the registry user is not set
  ansible.builtin.assert:
    that: compose_stack_registry_user | default('') | length > 0
    quiet: true
    fail_msg: "set compose_stack_registry_user: the project's images are in a private Docker Hub repository"

- name: Read the token and pull the images with a login that only the pull task holds
  vars:
    compose_stack_pull_reserve_seconds: 15
    compose_stack_pull_grace_seconds: 5
    compose_stack_pull_reap_seconds: 2
  block:
    - name: Stop when the pull deadline leaves no time for the pull task's own end
      ansible.builtin.assert:
        that:
          - compose_stack_pull_deadline_seconds | int > compose_stack_pull_reserve_seconds
        quiet: true
        fail_msg: "compose_stack_pull_deadline_seconds must be more than {{ compose_stack_pull_reserve_seconds }} seconds: the pull task keeps the last {{ compose_stack_pull_reserve_seconds }} for its own end"

    - name: Read the registry token from OpenBao, hidden, with no file
      ansible.builtin.include_role:
        name: openbao
        tasks_from: read_external.yml
      vars:
        openbao_read_consumer: deploy
        openbao_read_name: dockerhub_read

    - name: Pull every image of the Compose files, each by its digest
      ansible.builtin.shell:
        executable: /bin/bash
        stdin: "{{ openbao_external_read.value }}"
        cmd: |
          {
            set -u
            umask 077
            set -m
            user={{ compose_stack_registry_user | quote }}
            parent={{ compose_stack_registry_config_directory | quote }}
            owner={{ compose_stack_owner | quote }}
            deadline={{ (compose_stack_pull_deadline_seconds | int) - compose_stack_pull_reserve_seconds }}
            grace={{ compose_stack_pull_grace_seconds }}
            reap={{ compose_stack_pull_reap_seconds }}
            shell=$$
            SECONDS=0
            folder=
            pull=
            watch=
            cleaned=
            refuse() { printf 'REFUSED=%s\n' "$1"; exit 64; }
            alive() { kill -s 0 -- "-$pull" 2>/dev/null; }
            wait_gone() {
              limit=$((SECONDS + $1))
              while alive && [ "$SECONDS" -lt "$limit" ]; do sleep 1; done
            }
            end_pull() {
              if [ -n "$pull" ]; then
                kill -s TERM -- "-$pull" 2>/dev/null
                wait_gone "$grace"
                kill -s KILL -- "-$pull" 2>/dev/null
                wait_gone "$reap"
                if alive; then return 1; fi
                wait "$pull" 2>/dev/null
                pull=
              fi
              return 0
            }
            cleanup() {
              if [ -z "$cleaned" ]; then
                cleaned=1
                trap '' HUP INT TERM
                if ! end_pull; then
                  printf 'REFUSED=%s\n' "the image pull could not be stopped, so its login folder was kept"
                  exit 65
                fi
                case $folder in
                  "$parent"/login.*)
                    if ! rm -rf -- "$folder"; then
                      printf 'REFUSED=%s\n' "the pull's login folder could not be removed"
                      exit 65
                    fi
                    ;;
                esac
                if [ -n "$watch" ]; then kill -s KILL -- "-$watch" 2>/dev/null; fi
              fi
            }
            trap cleanup EXIT
            trap 'exit 1' HUP INT TERM
            IFS= read -r token || true
            token=$(printf '%s' "$token" | tr -d '[:space:]')
            if [ -z "$token" ]; then refuse "the registry token is empty"; fi
            if [ -e "$parent" ] || [ -L "$parent" ]; then
              if [ -z "$(find "$parent" -maxdepth 0 -type d -perm 0700 -user "$owner" 2>/dev/null)" ]; then
                refuse "the folder for the pull's login is not a directory with mode 0700 that $owner owns"
              fi
            else
              mkdir -m 0700 "$parent" || refuse "the folder for the pull's login could not be made"
            fi
            folder=$(mktemp -d "$parent/login.XXXXXX") || refuse "the pull's login folder could not be made"
            auth=$(printf '%s:%s' "$user" "$token" | base64 | tr -d '\n')
            case $auth in
              '' | *[!A-Za-z0-9+/=]*) refuse "the pull's login file is not a file with exactly one auth entry and no credsStore or credHelpers key" ;;
            esac
            expected='{"auths": {"https://index.docker.io/v1/": {"auth": "'$auth'"}}}'
            printf '%s\n' "$expected" > "$folder/config.json"
            chmod 0600 "$folder/config.json"
            raw=
            if IFS= read -r -d '' raw < "$folder/config.json" || [ "$raw" != "$expected"$'\n' ]; then
              refuse "the pull's login file is not a file with exactly one auth entry and no credsStore or credHelpers key"
            fi
            env -u DOCKER_AUTH_CONFIG "DOCKER_CONFIG=$folder" {{ compose_stack_docker | map('quote') | join(' ') }} --profile batch pull --quiet < /dev/null > /dev/null 2>&1 &
            pull=$!
            (
              trap - EXIT
              trap '' HUP INT TERM
              while kill -s 0 "$shell" 2>/dev/null; do sleep 1; done
              cleanup
            ) < /dev/null > /dev/null 2>&1 &
            watch=$!
            while kill -s 0 "$pull" 2>/dev/null; do
              if [ "$SECONDS" -ge "$deadline" ]; then exit 124; fi
              sleep 1
            done
            wait "$pull"
            code=$?
            pull=
            exit "$code"
          }
      register: compose_stack_pull
      failed_when: false
      changed_when: false
      no_log: true
      timeout: "{{ compose_stack_pull_deadline_seconds | int }}"

    - name: Stop with a fixed message when the pull was refused or failed
      ansible.builtin.fail:
        msg: >-
          {{ (compose_stack_pull.stdout_lines | select('match', '^REFUSED=') | map('regex_replace', '^REFUSED=', '') | list | first)
          if (compose_stack_pull.stdout_lines | select('match', '^REFUSED=') | list | length > 0)
          else ('the image pull ran past its deadline of ' ~ compose_stack_pull_deadline_seconds ~ ' seconds' if compose_stack_pull.rc == 124
          else 'the image pull failed with status ' ~ compose_stack_pull.rc) }}
      when: compose_stack_pull.rc != 0
