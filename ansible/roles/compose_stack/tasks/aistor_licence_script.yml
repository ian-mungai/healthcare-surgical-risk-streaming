# Reads compose_stack_bin_directory, compose_stack_aistor_licence_script, compose_stack_aistor_licence_sudoers, compose_stack_visudo, compose_stack_owner and
# compose_stack_group. AIStor's licence never enters Ansible: the launcher reads it on the owner's computer (from its OpenBao) and pipes it, on standard input of one SSH
# command, to the script that this step installs. The script and the shared atomic file helper that it imports are placed in a folder only the owner of the files can
# enter (mode 0700 for the script and the folder, 0600 for the helper). The script refuses anything that cannot be a licence by a fixed code and writes the one
# root-only licence file that the Compose service mounts. Nothing in this step reads or holds the licence. The sudoers drop-in beside them turns off sudo's input and
# output recording for exactly the command line that the launcher runs; it is checked with visudo before it takes its place, so a file that sudo cannot read is never
# installed. The Airbyte role installs its key script in the same folder with the same owner and mode. A second run changes nothing.
- name: Create the folder of the platform's scripts
  ansible.builtin.file:
    path: "{{ compose_stack_bin_directory }}"
    state: directory
    owner: "{{ compose_stack_owner }}"
    group: "{{ compose_stack_group }}"
    mode: "0700"

- name: Install the helper that writes a secret file whole or not at all
  ansible.builtin.copy:
    src: "{{ role_path }}/../secret_files/module_utils/secret_files.py"
    dest: "{{ compose_stack_bin_directory }}/secret_files.py"
    owner: "{{ compose_stack_owner }}"
    group: "{{ compose_stack_group }}"
    mode: "0600"

- name: Install the script that places AIStor's licence
  ansible.builtin.copy:
    src: "{{ role_path }}/files/aistor_licence_install.py"
    dest: "{{ compose_stack_aistor_licence_script }}"
    owner: "{{ compose_stack_owner }}"
    group: "{{ compose_stack_group }}"
    mode: "0700"

- name: Make sure that sudo's folder of drop-in files exists
  ansible.builtin.file:
    path: "{{ compose_stack_aistor_licence_sudoers | dirname }}"
    state: directory
    owner: "{{ compose_stack_owner }}"
    group: "{{ compose_stack_group }}"
    mode: "0750"

- name: Turn off sudo's recording of input and output for the licence script's command line
  ansible.builtin.copy:
    src: "{{ role_path }}/files/aistor_licence_install.sudoers"
    dest: "{{ compose_stack_aistor_licence_sudoers }}"
    owner: "{{ compose_stack_owner }}"
    group: "{{ compose_stack_group }}"
    mode: "0440"
    validate: "{{ compose_stack_visudo }} -cf %s"
