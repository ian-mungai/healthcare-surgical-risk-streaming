# Reads compose_stack_secrets_directory, compose_stack_accounts and compose_stack_owner. File content is never read.
- name: Read the status of the password folders
  ansible.builtin.stat:
    path: "{{ item }}"
  register: compose_stack_folder_status
  loop:
    - "{{ compose_stack_secrets_directory }}"
    - "{{ compose_stack_secrets_directory }}/postgres"

- name: Read the status of each password file
  ansible.builtin.stat:
    path: "{{ compose_stack_secrets_directory }}/postgres/{{ item }}.password"
  register: compose_stack_file_status
  loop: "{{ compose_stack_accounts }}"

- name: Confirm each password folder and file is for its owner only
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - item.stat.mode == '0700'
      - item.stat.pw_name == compose_stack_owner
    fail_msg: "The password folder {{ item.item }} is missing, is readable by anyone but its owner or belongs to another user."
  loop: "{{ compose_stack_folder_status.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Confirm each password file is for its owner only
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.mode == '0600'
      - item.stat.pw_name == compose_stack_owner
    fail_msg: "The password file of {{ item.item }} is missing, is readable by anyone but its owner or belongs to another user."
  loop: "{{ compose_stack_file_status.results }}"
  loop_control:
    label: "{{ item.item }}"
