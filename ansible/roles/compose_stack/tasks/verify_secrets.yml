# Reads compose_stack_secrets_directory, compose_stack_accounts, compose_stack_owners and secret_files_root_owner. File content is never read.
# Owners are compared by number. The folders are for root. Each file is for the owner of the service that reads it, with mode 0400.
- name: Read the status of the password folders
  ansible.builtin.stat:
    path: "{{ item }}"
  register: compose_stack_folder_status
  loop:
    - "{{ compose_stack_secrets_directory }}"
    - "{{ compose_stack_secrets_directory }}/postgres"

- name: Read the status of each password file
  ansible.builtin.stat:
    path: "{{ compose_stack_secrets_directory }}/postgres/{{ item }}.password"
  register: compose_stack_file_status
  loop: "{{ compose_stack_accounts }}"

- name: Confirm each password folder is for root only
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - item.stat.mode == '0700'
      - item.stat.uid == (secret_files_root_owner.split(':')[0] | int)
      - item.stat.gid == (secret_files_root_owner.split(':')[1] | int)
    fail_msg: "The password folder {{ item.item }} is missing, is readable by anyone but root or belongs to another user."
  loop: "{{ compose_stack_folder_status.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Confirm each password file is for the user of the service that reads it and for nobody else
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.mode == '0400'
      - item.stat.uid == (compose_stack_owners[item.item].split(':')[0] | int)
      - item.stat.gid == (compose_stack_owners[item.item].split(':')[1] | int)
    fail_msg: "The password file of {{ item.item }} is missing, is readable by anyone but its owner, can be written or belongs to another user than the service that reads it."
  loop: "{{ compose_stack_file_status.results }}"
  loop_control:
    label: "{{ item.item }}"
