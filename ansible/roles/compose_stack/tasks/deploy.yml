# The stack playbook's part of the stack, run after the launcher stored the external secrets in the host's OpenBao. Order: create the Grafana password (generated once,
# kept in OpenBao and written from there to the file its container reads), log in to Docker Hub with the token that OpenBao holds and pull the project's images by digest
# (they were built and pushed from the owner's computer), create Airbyte's namespace on k3s and write the k3s token and certificate authority that the code location
# reads as Compose secrets, so a new host deploys in one pass, start PostgreSQL alone and wait for it, make the PostgreSQL accounts match the tool list, start the
# remaining services but the orchestration services and AIStor and wait for them, and make the Kafka topics and the registry's rules match their lists. AIStor starts
# in the AIStor step (ansible/storage.yml), after the launcher places its licence. The orchestration services
# (the code location and what waits for it) start last, from start_orchestration.yml, which the connection playbook runs after the Airbyte role and the key placement:
# the code location mounts files that only they can make, and it gives Nessie's main branch its first commit. A second run changes nothing.
- name: Create the Grafana password file
  ansible.builtin.include_tasks: grafana_password.yml

- name: Log in to Docker Hub and pull the project's images by digest
  ansible.builtin.include_tasks: pull_images.yml

- name: Create Airbyte's namespace on k3s
  ansible.builtin.include_role:
    name: airbyte
    tasks_from: cluster.yml

- name: Write the k3s token and certificate authority that the code location reads
  ansible.builtin.include_role:
    name: airbyte
    tasks_from: group_access.yml

- name: Start PostgreSQL and wait for its health
  ansible.builtin.include_tasks: start.yml
  vars:
    compose_stack_start_services: [postgres]

- name: Make the PostgreSQL accounts match the tool list
  ansible.builtin.include_tasks: provision.yml

- name: Start the remaining services, except the orchestration services, and wait for their health
  ansible.builtin.include_tasks: start.yml
  vars:
    compose_stack_start_services: []
    compose_stack_start_except: "{{ compose_stack_orchestration_services + compose_stack_storage_services }}"

- name: Make the Kafka topics match the topic list
  ansible.builtin.include_tasks: kafka.yml

- name: Make the registry's compatibility rules match the rule list
  ansible.builtin.include_tasks: registry.yml
