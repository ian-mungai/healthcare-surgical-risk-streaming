# Reads compose_stack_secrets_directory and grafana_user (the numeric user and group of the Grafana container). A missing password file is created with a random
# password for that user with mode 0400, and an existing one keeps its password and is given that owner and mode. No password is printed.
- name: Create the Grafana administrator password file when it is missing and give it to the Grafana user
  secret_file:
    path: "{{ compose_stack_secrets_directory }}/grafana/admin.password"
    owner: "{{ grafana_user }}"
  no_log: true

- name: Check the Grafana administrator password file
  ansible.builtin.include_tasks: verify_grafana_password.yml
