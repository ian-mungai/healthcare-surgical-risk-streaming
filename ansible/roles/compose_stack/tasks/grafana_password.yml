# Reads compose_stack_secrets_directory, compose_stack_owner and compose_stack_grafana_owner (the numeric user of the Grafana container).
# A missing password file is created with a random password and an existing one is kept. No password is printed.
- name: Create the Grafana password folder
  ansible.builtin.file:
    path: "{{ compose_stack_secrets_directory }}/grafana"
    state: directory
    owner: "{{ compose_stack_owner }}"
    mode: "0700"

- name: Create the Grafana administrator password file when it is missing
  ansible.builtin.copy:
    dest: "{{ compose_stack_secrets_directory }}/grafana/admin.password"
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
    force: false
    owner: "{{ compose_stack_grafana_owner | default(472) }}"
    mode: "0400"
  no_log: true

- name: Keep the Grafana password file for the Grafana user only
  ansible.builtin.file:
    path: "{{ compose_stack_secrets_directory }}/grafana/admin.password"
    state: file
    owner: "{{ compose_stack_grafana_owner | default(472) }}"
    mode: "0400"
