# Reads compose_stack_secrets_directory and grafana_user (the numeric user and group of the Grafana container). The password is made once, kept in the host's OpenBao
# (secret/data/services/grafana/admin_password) and written from there to the file that the container reads, for that user with mode 0400. A host that already has the
# file keeps its password: it goes into OpenBao while the path is empty. No password is printed.
- name: Keep the Grafana administrator password in OpenBao and write it from there to its file for the Grafana user
  ansible.builtin.include_role:
    name: openbao
    tasks_from: generated_secret.yml
  vars:
    openbao_generated_name: grafana/admin_password
    openbao_generated_dest: "{{ compose_stack_secrets_directory }}/grafana/admin.password"
    openbao_generated_owner: "{{ grafana_user }}"

- name: Check the Grafana administrator password file
  ansible.builtin.include_tasks: verify_grafana_password.yml
