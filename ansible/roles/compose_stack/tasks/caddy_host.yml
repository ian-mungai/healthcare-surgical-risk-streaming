# Reads compose_stack_compose_directory, compose_stack_owner and compose_stack_group. The host's Tailscale name and address come from the host at
# deploy time and are never in Git. The settings file holds no secret: Caddy reads the name and the address, and the certificates stay in Tailscale.
- name: Read the host's Tailscale status
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: compose_stack_tailscale_status
  changed_when: false
  check_mode: false
  timeout: 60

- name: Read the host's Tailscale name, address and certificate names
  ansible.builtin.set_fact:
    compose_stack_tailscale_name: "{{ (compose_stack_tailscale_status.stdout | from_json).Self.DNSName | regex_replace('[.]$', '') }}"
    compose_stack_tailscale_address: "{{ (compose_stack_tailscale_status.stdout | from_json).Self.TailscaleIPs | select('match', '^[0-9.]+$') | list | first | default('') }}"
    compose_stack_tailscale_certificate_names: "{{ (compose_stack_tailscale_status.stdout | from_json).CertDomains | default([]) }}"

- name: Refuse a host that cannot serve Tailscale certificates on a Tailscale address
  ansible.builtin.assert:
    that:
      - compose_stack_tailscale_name is match('^[a-z0-9-]+([.][a-z0-9-]+)*[.]ts[.]net$')
      - compose_stack_tailscale_address is match('^100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.][0-9]{1,3}[.][0-9]{1,3}$')
      - compose_stack_tailscale_name in compose_stack_tailscale_certificate_names
    fail_msg: >-
      The host has no Tailscale name that ends in ts.net with HTTPS certificates enabled, or no address in the Tailscale range. Enable HTTPS certificates
      for the network in the Tailscale admin console, then run the deploy again.

- name: Create the Caddy settings folder
  ansible.builtin.file:
    path: "{{ compose_stack_compose_directory }}/caddy"
    state: directory
    owner: "{{ compose_stack_owner }}"
    group: "{{ compose_stack_group }}"
    mode: "0755"

- name: Write the settings Caddy reads
  ansible.builtin.copy:
    dest: "{{ compose_stack_compose_directory }}/caddy/host.env"
    content: |
      TS_HOST_NAME={{ compose_stack_tailscale_name }}
      TS_ADDRESS={{ compose_stack_tailscale_address }}
    owner: "{{ compose_stack_owner }}"
    group: "{{ compose_stack_group }}"
    mode: "0644"
