# Reads openbao_secret_files (a list of path and owner, as uid:gid), openbao_secrets_directory and secret_files_root_owner. File content is never read.
# Owners are compared by number. The folder is for root. Each file is for the owner of the service that reads it, with mode 0400.
- name: Read the status of the OpenBao secret folder
  ansible.builtin.stat:
    path: "{{ openbao_secrets_directory }}/openbao"
  register: openbao_folder_status

- name: Read the status of each OpenBao secret file
  ansible.builtin.stat:
    path: "{{ item.path }}"
  register: openbao_file_status
  loop: "{{ openbao_secret_files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Confirm the OpenBao secret folder is for root only
  ansible.builtin.assert:
    that:
      - openbao_folder_status.stat.exists
      - openbao_folder_status.stat.isdir
      - openbao_folder_status.stat.mode == '0700'
      - openbao_folder_status.stat.uid == (secret_files_root_owner.split(':')[0] | int)
      - openbao_folder_status.stat.gid == (secret_files_root_owner.split(':')[1] | int)
    fail_msg: "The OpenBao secret folder is missing, is readable by anyone but root or belongs to another user."

- name: Confirm each OpenBao secret file is for the user of the service that reads it and for nobody else
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.mode == '0400'
      - item.stat.uid == (item.item.owner.split(':')[0] | int)
      - item.stat.gid == (item.item.owner.split(':')[1] | int)
    fail_msg: "The OpenBao secret file {{ item.item.path | basename }} is missing, is readable by anyone but its owner, can be written or belongs to another user than the service that reads it."
  loop: "{{ openbao_file_status.results }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
