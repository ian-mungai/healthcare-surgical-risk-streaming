# Reads openbao_generated_name and openbao_generated_dest and openbao_generated_owner (set by the caller), and openbao_secrets_directory and openbao_address. The secret
# is made once (or taken from the file when a host made before this step already has one), stored in OpenBao while its path is empty, and written from OpenBao to the
# file that its container reads, for the numeric owner given, with mode 0400. The value goes to no result, variable or message.
- name: Keep the generated secret in OpenBao and write it from there to its file
  openbao_bootstrap:
    step: generated
    secrets_directory: "{{ openbao_secrets_directory }}"
    address: "{{ openbao_address }}"
    name: "{{ openbao_generated_name }}"
    dest: "{{ openbao_generated_dest }}"
    file_owner: "{{ openbao_generated_owner }}"
  timeout: 120
  no_log: true
