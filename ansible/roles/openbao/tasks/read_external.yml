# Reads openbao_read_consumer and openbao_read_name (set by the caller), and openbao_secrets_directory, openbao_external_secrets_file and openbao_address. The consumer
# logs in with its own AppRole and reads its own external secret (compose/external_secrets.txt) from OpenBao. The value is the field ``value`` of the registered
# openbao_external_read, which only the caller's one task that takes it on its standard input uses. The task is hidden, and no file or message holds the value.
- name: Read the external secret from OpenBao for its consumer
  openbao_bootstrap:
    step: read
    secrets_directory: "{{ openbao_secrets_directory }}"
    external_secrets_file: "{{ openbao_external_secrets_file }}"
    address: "{{ openbao_address }}"
    consumer: "{{ openbao_read_consumer }}"
    name: "{{ openbao_read_name }}"
  register: openbao_external_read
  changed_when: false
  timeout: 120
  no_log: true
