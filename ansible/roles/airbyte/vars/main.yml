# The messages of the key placement step (tasks/aws_key.yml), one for each reason code that the module airbyte_aws_key can return besides ok. The module never fails with text
# that could hold a value, so the message that the owner reads is chosen here from the code. A message names the profile and the exit status of the AWS command line, which
# are not secret, and nothing else.
airbyte_aws_key_messages:
  session_token: >-
    The profile {{ airbyte_aws_profile }} yields a session token. Airbyte's connectors need the own access key of an IAM user, not a temporary credential, so no key was placed.
  not_a_static_key: >-
    The AWS command line answered for the profile {{ airbyte_aws_profile }} with something that is not the access key ID and the secret of an AWS access key, so no key was placed.
  empty: >-
    The AWS command line answered for the profile {{ airbyte_aws_profile }} with no access key ID or no secret, so no key was placed.
  export_failed: >-
    The AWS command line could not export the credentials of the profile {{ airbyte_aws_profile }} (exit status {{ airbyte_aws_export.rc }}), so no key was placed. Run
    aws configure export-credentials --profile {{ airbyte_aws_profile }} --format process by hand to see why.
  cannot_write: >-
    The key could not be written under the secrets folder on the host, so it was not placed. Check the folder's owner and its free space.
