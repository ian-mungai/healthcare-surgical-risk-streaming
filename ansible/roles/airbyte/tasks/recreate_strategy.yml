# Reads airbyte_recreate_deployments (each name is the part after the release name), airbyte_release, airbyte_namespace and the deadline. A merge patch sets the
# strategy type and clears the rolling update figures, which Kubernetes refuses next to Recreate. The patch changes no pod, so it starts no rollout.
- name: Set the strategy of each deployment to Recreate
  ansible.builtin.shell:
    cmd: |
      set -u
      for name in $DEPLOYMENTS; do
        out=$(k3s kubectl patch deployment "$RELEASE-$name" --namespace "$NAMESPACE" --type merge --patch "$PATCH" 2>&1) && continue
        case "$out" in
          *NotFound*) ;;
          *) exit 3 ;;
        esac
      done
  environment:
    DEPLOYMENTS: "{{ airbyte_recreate_deployments | join(' ') }}"
    RELEASE: "{{ airbyte_release }}"
    NAMESPACE: "{{ airbyte_namespace }}"
    PATCH: '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'
  register: airbyte_release_strategy
  changed_when: true
  failed_when: false
  no_log: true
  timeout: 60

- name: Stop when the strategy of a deployment could not be set
  when: airbyte_release_strategy.rc != 0
  ansible.builtin.fail:
    msg: >-
      k3s could not set the strategy of the Airbyte deployments {{ airbyte_recreate_deployments | join(', ') }} to Recreate (exit status {{ airbyte_release_strategy.rc }}),
      so the run stopped before the upgrade or the restart could start a new pod beside an old one that holds its database connections. Run kubectl patch by hand to see why.
