# Reads airbyte_web_port, airbyte_namespace, airbyte_directory, airbyte_secrets_directory and airbyte_connection_deadline_seconds, and what connection_document.yml and aws_key.yml read. The raw connection (the publisher's
# S3 source, the project's landing prefix as the destination, delivery "Copy raw files", no schedule) is made in Airbyte from code, with each connector at its pinned
# version. The module finds each object by its name: a first run creates them, a second run changes nothing and a drifted object is repaired. It prints each change
# it made and no token, no secret and no body. The project profile's access key, which both connectors take, is placed on the host first (aws_key.yml) and is added by the module
# at apply time, so the document and every value rendered on the owner's computer hold none; the module keeps a fingerprint of the key's ID in connection_key.json. A call has a deadline, and a failure names the call and its status.
- name: Render the document of the raw connection
  ansible.builtin.include_tasks: connection_document.yml

- name: Place the project profile's access key on the host
  ansible.builtin.include_tasks: aws_key.yml

- name: Make the raw connection in Airbyte match the document
  airbyte_connection:
    document: "{{ airbyte_connection_document }}"
    base_url: "http://127.0.0.1:{{ airbyte_web_port }}/api/public/v1"
    namespace: "{{ airbyte_namespace }}"
    timeout_seconds: "{{ airbyte_connection_deadline_seconds }}"
    secrets_directory: "{{ airbyte_secrets_directory }}"
    record_file: "{{ airbyte_directory }}/connection_key.json"
  timeout: "{{ airbyte_connection_deadline_seconds | int + 60 }}"
