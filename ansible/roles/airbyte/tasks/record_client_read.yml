# Reads airbyte_namespace. Airbyte writes the instance administrator's client ID and secret into the secret airbyte-auth-secrets when it first starts. They are read into
# two variables that hold no more than the next task needs, and never shown. A secret that does not hold them within the deadline stops the run and names the secret.
- name: Read the administrator's client ID and secret from the namespace's auth secret
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - secret
      - airbyte-auth-secrets
      - --namespace
      - "{{ airbyte_namespace }}"
      - --output
      - "jsonpath={.data.instance-admin-client-id}:{.data.instance-admin-client-secret}"
  register: airbyte_record_client_read
  changed_when: false
  check_mode: false
  no_log: true
  retries: "{{ [((airbyte_record_client_deadline_seconds | default(120)) | int / 4) | int, 1] | max }}"
  delay: 4
  until: airbyte_record_client_read.rc == 0 and (airbyte_record_client_read.stdout | length) > 1 and not airbyte_record_client_read.stdout.startswith(':') and not airbyte_record_client_read.stdout.endswith(':')
  timeout: 30
  failed_when: false

- name: Stop with the secret's name when it holds no client credentials
  ansible.builtin.assert:
    that:
      - airbyte_record_client_read.rc == 0
      - (airbyte_record_client_read.stdout.split(':') | length) == 2
      - (airbyte_record_client_read.stdout.split(':')[0] | length) > 0
      - (airbyte_record_client_read.stdout.split(':')[1] | length) > 0
    quiet: true
    fail_msg: the secret airbyte-auth-secrets holds no instance-admin-client-id and instance-admin-client-secret yet
  no_log: true

- name: Keep the two values for the next task
  ansible.builtin.set_fact:
    airbyte_record_client_id: "{{ airbyte_record_client_read.stdout.split(':')[0] | b64decode }}"
    airbyte_record_client_secret: "{{ airbyte_record_client_read.stdout.split(':')[1] | b64decode }}"
  no_log: true
