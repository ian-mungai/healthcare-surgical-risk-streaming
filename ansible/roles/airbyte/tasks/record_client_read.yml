# Reads airbyte_namespace and, optionally, airbyte_record_client_deadline_seconds (default 120). Airbyte writes the instance administrator's client ID and secret into the secret
# airbyte-auth-secrets when it first starts. One command waits for both, inside one elapsed-time deadline that the coreutils timeout program enforces around the whole loop, so no
# attempt has a fresh bound of its own. The two values are read into two variables that hold no more than the next task needs, and never shown. A secret that does not hold them
# within the deadline stops the run and names the secret. kubectl's own text is never shown and never written to a file: kubectl prints the path and the token of a malformed
# kubeconfig, and a file would survive a SIGKILL. Each attempt keeps kubectl's standard output and standard error apart in memory: the credentials are read from standard output
# only, so a warning on standard error never reaches them, and standard error is used only to classify a failed attempt. Each completed attempt is reduced in memory to one fixed word (refused, not found, unreachable, not filled or failed) that replaces
# the kept one; an attempt that is still running when the deadline's signal arrives has completed nothing, so the last completed attempt's word is the one printed (none before the
# first). An attempt whose result is not one of those words (its subshell was killed before it finished, so what it captured may be the values) is not a
# completed attempt: it is dropped and the kept word stays. Trailing newlines of the values are dropped before the last line is taken. The stop message takes
# only a word of that fixed list out of the command's standard error, so no other text there can reach it.
- name: Wait for and read the administrator's client ID and secret from the namespace's auth secret
  ansible.builtin.command:
    argv:
      - timeout
      - "{{ airbyte_record_client_deadline_seconds | default(120) }}"
      - sh
      - -c
      - |
        reason=none
        trap 'printf "kubectl-reason:%s\n" "$reason" >&2; exit 1' TERM
        classify() {
          case "$1" in
            *orbidden*|*nauthorized*) word=refused ;;
            *"(NotFound)"*) word="not found" ;;
            *"connection refused"*|*"was refused"*|*"no such host"*|*"i/o timeout"*|*"Unable to connect"*|*"couldn't get current server API"*) word=unreachable ;;
            *) word=failed ;;
          esac
        }
        while :; do
          result=$( { err=$(k3s kubectl get secret airbyte-auth-secrets --namespace "$1" --output "jsonpath={.data.instance-admin-client-id}:{.data.instance-admin-client-secret}" 2>&1 1>&3 3>&-)
            status=$?
            word=ok
            if [ "$status" -ne 0 ]; then classify "$err"; fi
            printf '\nkubectl-result:%s\n' "$word"; } 3>&1 )
          word=${result##*kubectl-result:}
          case "$word" in
            ok|refused|"not found"|unreachable|failed) ;;
            *) sleep 2; continue ;;
          esac
          if [ "$word" = ok ]; then
            captured=$(printf '%s' "${result%kubectl-result:*}")
            value=$(printf '%s\n' "$captured" | tail -n 1)
            case "$value" in
              ?*:?*) printf '%s' "$value"; exit 0 ;;
            esac
            reason="not filled"
          else
            reason=$word
          fi
          sleep 2
        done
      - airbyte_record_client_wait
      - "{{ airbyte_namespace }}"
  register: airbyte_record_client_read
  changed_when: false
  check_mode: false
  no_log: true
  failed_when: false
  timeout: "{{ (airbyte_record_client_deadline_seconds | default(120)) | int + 15 }}"

- name: Stop with the secret's name when it holds no client credentials
  ansible.builtin.assert:
    that:
      - airbyte_record_client_read.rc == 0
      - (airbyte_record_client_read.stdout.split(':') | length) == 2
      - (airbyte_record_client_read.stdout.split(':')[0] | length) > 0
      - (airbyte_record_client_read.stdout.split(':')[1] | length) > 0
    quiet: true
    fail_msg: >-
      the secret airbyte-auth-secrets did not give the instance-admin-client-id and instance-admin-client-secret before the deadline.
      The last completed attempt of kubectl found: {{ (airbyte_record_client_read.stderr | default('') | regex_findall('(?m)^kubectl-reason:(refused|not found|unreachable|not filled|failed)$') | last) | default('none') }}.
  no_log: true

- name: Keep the two values for the next task
  ansible.builtin.set_fact:
    airbyte_record_client_id: "{{ airbyte_record_client_read.stdout.split(':')[0] | b64decode }}"
    airbyte_record_client_secret: "{{ airbyte_record_client_read.stdout.split(':')[1] | b64decode }}"
  no_log: true
