# Reads airbyte_directory, airbyte_chart_version, airbyte_chart_sha256, airbyte_namespace, airbyte_release, airbyte_kubeconfig and
# airbyte_release_deadline_seconds. The release is installed or upgraded only when it is not deployed or when the chart or a values file changed since the
# last success, so a second run starts no migration and changes nothing. A failure shows each pod's phase and why it waits, and never a log or a value. A run
# that was stopped inside Helm leaves the release with an operation pending, and Helm refuses to install over it. Before the decision, a pending upgrade or
# rollback is rolled back to the last deployed revision and a pending first install, or an uninstall that did not finish, is uninstalled (Helm keeps the
# volume claims of stateful sets, and Airbyte's database is on the stack's PostgreSQL, which neither command touches). Every other state goes on as it is.
# The chart's pre-upgrade hook writes the ConfigMap with AIRBYTE_URL before the upgrade runs, and a rollback does not undo it. So the file with the recorded
# inputs is removed before any recovery command and before any install or upgrade starts, and written only after the pinned install succeeded. A release that
# a stopped run touched then has no record, and the next run runs the full upgrade from its own inputs. A run that recovered always installs, whatever record
# it read before the recovery removed the file (older code left a record next to a pending release, and a rollback does not undo the hook's ConfigMap). Each
# of the six Helm commands has no_log, because the host launcher inherits ANSIBLE_VERBOSITY and Ansible prints each task's result from verbosity 1; a Helm
# command that fails stops the run with fixed text naming the status and the step, which stays visible. A status read decides only when it succeeded or Helm
# said "release: not found" (the release is absent); any other error stops the run.
- name: Read the checksum of each values file
  ansible.builtin.stat:
    path: "{{ airbyte_directory }}/{{ item }}"
    checksum_algorithm: sha256
  register: airbyte_values_status
  loop:
    - values.yaml
    - limits.values.yaml
    - host.values.yaml

- name: Work out the inputs that the release is made from
  ansible.builtin.set_fact:
    airbyte_release_inputs: "{{ ([airbyte_chart_sha256] + (airbyte_values_status.results | map(attribute='stat.checksum') | list)) | join(':') | hash('sha256') }}"

- name: Read the inputs of the last successful release
  ansible.builtin.slurp:
    src: "{{ airbyte_directory }}/release_inputs.sha256"
  register: airbyte_release_recorded
  failed_when: false

- name: Read the release's status
  ansible.builtin.command:
    argv: [helm, status, "{{ airbyte_release }}", --namespace, "{{ airbyte_namespace }}", --output, json]
  environment:
    KUBECONFIG: "{{ airbyte_kubeconfig }}"
  register: airbyte_release_status
  changed_when: false
  failed_when: false
  no_log: true
  check_mode: false
  timeout: 60

- name: Note the release's state
  ansible.builtin.set_fact:
    airbyte_release_state: >-
      {{ (airbyte_release_status.stdout | from_json).info.status if airbyte_release_status.rc == 0
         else ('not installed' if 'release: not found' in airbyte_release_status.stderr else 'unreadable') }}

- name: Stop when the release's status cannot be read
  when: airbyte_release_state == 'unreadable'
  ansible.builtin.fail:
    msg: >-
      Helm could not read the status of the Airbyte release {{ airbyte_release }} in namespace {{ airbyte_namespace }} (exit status {{ airbyte_release_status.rc }}),
      so no step ran. Run helm status by hand to see why.

- name: Note whether the release needs a recovery before the install
  ansible.builtin.set_fact:
    airbyte_release_recovery: "{{ airbyte_release_state in ['pending-upgrade', 'pending-rollback', 'pending-install', 'uninstalling'] }}"

- name: Read the release's history
  when: airbyte_release_state in ['pending-upgrade', 'pending-rollback']
  ansible.builtin.command:
    argv: [helm, history, "{{ airbyte_release }}", --namespace, "{{ airbyte_namespace }}", --output, json]
  environment:
    KUBECONFIG: "{{ airbyte_kubeconfig }}"
  register: airbyte_release_history
  changed_when: false
  failed_when: false
  no_log: true
  check_mode: false
  timeout: 60

- name: Stop when the release's history cannot be read
  when: airbyte_release_history is not skipped and airbyte_release_history.rc != 0
  ansible.builtin.fail:
    msg: >-
      Helm could not read the history of the Airbyte release {{ airbyte_release }} (status {{ airbyte_release_state }}, exit status {{ airbyte_release_history.rc }}),
      so it was not rolled back. Run helm history by hand to see why.

- name: Pick the last revision that was deployed
  when: airbyte_release_state in ['pending-upgrade', 'pending-rollback']
  ansible.builtin.set_fact:
    airbyte_release_good_revision: "{{ (airbyte_release_history.stdout | from_json) | selectattr('status', 'eq', 'deployed') | map(attribute='revision') | list | sort | last | default(0) }}"

- name: Stop when no revision was ever deployed to roll back to
  when: airbyte_release_state in ['pending-upgrade', 'pending-rollback'] and airbyte_release_good_revision | int == 0
  ansible.builtin.fail:
    msg: The Airbyte release is {{ airbyte_release_state }} and has no deployed revision to roll back to.

- name: Forget the recorded inputs before the recovery
  when: airbyte_release_recovery | bool
  ansible.builtin.file:
    path: "{{ airbyte_directory }}/release_inputs.sha256"
    state: absent

- name: Roll the release back to its last deployed revision
  when: airbyte_release_state in ['pending-upgrade', 'pending-rollback']
  ansible.builtin.command:
    argv:
      - helm
      - rollback
      - "{{ airbyte_release }}"
      - "{{ airbyte_release_good_revision }}"
      - --namespace
      - "{{ airbyte_namespace }}"
      - --wait
      - --timeout
      - "{{ airbyte_release_deadline_seconds }}s"
  environment:
    KUBECONFIG: "{{ airbyte_kubeconfig }}"
  register: airbyte_release_rollback
  changed_when: true
  failed_when: false
  no_log: true
  timeout: "{{ airbyte_release_deadline_seconds | int + 120 }}"

- name: Stop when the rollback failed
  when: airbyte_release_rollback is not skipped and airbyte_release_rollback.rc != 0
  ansible.builtin.fail:
    msg: >-
      Helm could not roll back the Airbyte release {{ airbyte_release }} to revision {{ airbyte_release_good_revision }} (status {{ airbyte_release_state }},
      exit status {{ airbyte_release_rollback.rc }}). Run helm rollback by hand to see why.

- name: Uninstall the release that never finished its first install or its uninstall
  when: airbyte_release_state in ['pending-install', 'uninstalling']
  ansible.builtin.command:
    argv:
      - helm
      - uninstall
      - "{{ airbyte_release }}"
      - --namespace
      - "{{ airbyte_namespace }}"
      - --wait
      - --timeout
      - "{{ airbyte_release_deadline_seconds }}s"
  environment:
    KUBECONFIG: "{{ airbyte_kubeconfig }}"
  register: airbyte_release_uninstall
  changed_when: true
  failed_when: false
  no_log: true
  timeout: "{{ airbyte_release_deadline_seconds | int + 120 }}"

- name: Stop when the uninstall failed
  when: airbyte_release_uninstall is not skipped and airbyte_release_uninstall.rc != 0
  ansible.builtin.fail:
    msg: >-
      Helm could not uninstall the Airbyte release {{ airbyte_release }} (status {{ airbyte_release_state }}, exit status {{ airbyte_release_uninstall.rc }}).
      Run helm uninstall by hand to see why.

- name: Read the release's status again
  when: airbyte_release_recovery | bool
  ansible.builtin.command:
    argv: [helm, status, "{{ airbyte_release }}", --namespace, "{{ airbyte_namespace }}", --output, json]
  environment:
    KUBECONFIG: "{{ airbyte_kubeconfig }}"
  register: airbyte_release_status_now
  changed_when: false
  failed_when: false
  no_log: true
  check_mode: false
  timeout: 60

- name: Note the release's state after the recovery, or the first reading when none ran
  ansible.builtin.set_fact:
    airbyte_release_state_now: >-
      {{ airbyte_release_state if not (airbyte_release_recovery | bool)
         else ((airbyte_release_status_now.stdout | from_json).info.status if airbyte_release_status_now.rc == 0
               else ('not installed' if 'release: not found' in airbyte_release_status_now.stderr else 'unreadable')) }}

- name: Stop when the release's status cannot be read after the recovery
  when: airbyte_release_state_now == 'unreadable'
  ansible.builtin.fail:
    msg: >-
      Helm could not read the status of the Airbyte release {{ airbyte_release }} after the recovery (status before it: {{ airbyte_release_state }},
      exit status {{ airbyte_release_status_now.rc }}), so the install did not start. Run helm status by hand to see why.

- name: Decide whether the release must be installed or upgraded
  ansible.builtin.set_fact:
    airbyte_release_needed: >-
      {{ airbyte_release_recovery | bool
         or airbyte_release_state_now != 'deployed'
         or (airbyte_release_recorded.content | default('') | b64decode | trim) != airbyte_release_inputs }}

- name: Install or upgrade the release and wait for it
  when: airbyte_release_needed | bool
  block:
    - name: Forget the recorded inputs before the install starts
      ansible.builtin.file:
        path: "{{ airbyte_directory }}/release_inputs.sha256"
        state: absent

    - name: Install or upgrade the release from the pinned chart archive
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - "{{ airbyte_release }}"
          - "{{ airbyte_directory }}/airbyte-{{ airbyte_chart_version }}.tgz"
          - --namespace
          - "{{ airbyte_namespace }}"
          - --values
          - "{{ airbyte_directory }}/values.yaml"
          - --values
          - "{{ airbyte_directory }}/limits.values.yaml"
          - --values
          - "{{ airbyte_directory }}/host.values.yaml"
          - --wait
          - --timeout
          - "{{ airbyte_release_deadline_seconds }}s"
      environment:
        KUBECONFIG: "{{ airbyte_kubeconfig }}"
      register: airbyte_release_install
      changed_when: true
      failed_when: false
      no_log: true
      timeout: "{{ airbyte_release_deadline_seconds | int + 120 }}"

    - name: Stop when the install or upgrade failed
      when: airbyte_release_install.rc != 0
      ansible.builtin.fail:
        msg: >-
          Helm could not install or upgrade the Airbyte release {{ airbyte_release }} (status {{ airbyte_release_state_now }}, exit status {{ airbyte_release_install.rc }}).
          Run helm upgrade by hand to see why.

    # The chart gives the pods their settings as environment values from one ConfigMap, which a pod reads only when it starts, and an upgrade that changes
    # only that ConfigMap leaves the pods running with the old values (live host, Nov 24 2026: the workload launcher kept a 256Mi sidecar limit after the
    # ConfigMap said 512Mi). So an upgrade of a release that was deployed restarts every deployment of the namespace and waits until each is available; a
    # first install starts every pod with the new values. A failure stops the run before the inputs are recorded, so the next run upgrades and restarts again.
    - name: Restart every Airbyte deployment so that changed settings reach the pods
      when: airbyte_release_state_now == 'deployed'
      ansible.builtin.command:
        argv: [k3s, kubectl, rollout, restart, deployment, --namespace, "{{ airbyte_namespace }}"]
      register: airbyte_release_restart
      changed_when: true
      failed_when: false
      no_log: true
      timeout: 120

    - name: Stop when the deployments could not be restarted
      when: airbyte_release_restart is not skipped and airbyte_release_restart.rc != 0
      ansible.builtin.fail:
        msg: >-
          The Airbyte release {{ airbyte_release }} was upgraded, but k3s could not restart the Airbyte deployments (exit status {{ airbyte_release_restart.rc }}),
          so its pods may still run with the old settings. Run the role again.

    - name: Wait until every restarted deployment is available
      when: airbyte_release_state_now == 'deployed'
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - wait
          - --for=condition=Available
          - deployment
          - --all
          - --namespace
          - "{{ airbyte_namespace }}"
          - "--timeout={{ airbyte_release_deadline_seconds }}s"
      register: airbyte_release_restarted
      changed_when: false
      failed_when: false
      no_log: true
      timeout: "{{ airbyte_release_deadline_seconds | int + 60 }}"

    - name: Stop when a restarted deployment did not become available
      when: airbyte_release_restarted is not skipped and airbyte_release_restarted.rc != 0
      ansible.builtin.fail:
        msg: >-
          The Airbyte release {{ airbyte_release }} was upgraded, but k3s could not restart the Airbyte deployments within
          {{ airbyte_release_deadline_seconds }} seconds (exit status {{ airbyte_release_restarted.rc }}). Run the role again.

    - name: Record the inputs of this successful release
      ansible.builtin.copy:
        dest: "{{ airbyte_directory }}/release_inputs.sha256"
        content: "{{ airbyte_release_inputs }}\n"
        owner: "{{ airbyte_owner }}"
        group: "{{ airbyte_group }}"
        mode: "0644"
  rescue:
    - name: Read each pod's phase and why it waits, without logs
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - get
          - pods
          - --namespace
          - "{{ airbyte_namespace }}"
          - --output
          - custom-columns=NAME:.metadata.name,PHASE:.status.phase,WAITING:.status.containerStatuses[*].state.waiting.reason
      register: airbyte_release_diagnosis
      changed_when: false
      failed_when: false
      timeout: 60

    - name: Stop with the pods that did not become ready
      ansible.builtin.fail:
        msg: >-
          The Airbyte release did not become ready within {{ airbyte_release_deadline_seconds }} seconds. Pods in namespace {{ airbyte_namespace }}:
          {{ airbyte_release_diagnosis.stdout | default('unreadable') }}
