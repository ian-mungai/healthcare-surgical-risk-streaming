# Deploys Airbyte on k3s from its Helm chart: installs Helm from a pinned release, checks the pinned chart against the tracked values and the limits file,
# creates the namespace, makes the secrets from files on the host, installs or upgrades the release only when its inputs changed and forwards the web
# service to the host's local address. A second run changes nothing. Every wait ends at its deadline and a failure names what did not become ready.
- name: Install Helm
  ansible.builtin.include_tasks: helm.yml

- name: Download the chart and check it
  ansible.builtin.include_tasks: chart.yml

- name: Create the namespace and its default container memory limit
  ansible.builtin.include_tasks: cluster.yml

- name: Create the generated secret files
  ansible.builtin.include_tasks: secret_files.yml

- name: Make the Kubernetes secrets match the files
  ansible.builtin.include_tasks: secrets.yml

- name: Place the values files
  ansible.builtin.include_tasks: place_files.yml

- name: Install or upgrade the release
  ansible.builtin.include_tasks: release.yml

- name: Forward the web service to the local address
  ansible.builtin.include_tasks: web_forward.yml

- name: Confirm that Airbyte is ready and answers on the local address
  ansible.builtin.include_tasks: verify.yml
