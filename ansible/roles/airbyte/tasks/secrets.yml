# Reads airbyte_secrets_directory, airbyte_namespace and airbyte_database_user. The module sends each value on standard input and prints none.
- name: Make the Kubernetes secrets of Airbyte match the secret files
  airbyte_secrets:
    step: secrets
    secrets_directory: "{{ airbyte_secrets_directory }}"
    namespace: "{{ airbyte_namespace }}"
    database_user: "{{ airbyte_database_user }}"
  timeout: 120
