# Reads airbyte_recreate_deployments (each name is the part after the release name), airbyte_release, airbyte_namespace and airbyte_scale_down_deadline_seconds.
# Helm's rollback has no post-renderer and applies the manifests of an older revision, which may state a rolling update (the chart's template for the workload API
# server does, and the others default to one). So before a rollback, each of these deployments is scaled to zero and the run waits until no pod has the deployment's
# own selector, which also counts a pod that is terminating and still holds its connections. A deployment that the release lacks is skipped. A selector that cannot
# be read, or an empty one that would match every pod of the namespace, stops the run. The wait ends at the deadline. The rollback's own manifests then start the new
# pods with nothing beside them. Each exit status is a fixed text: 3 scaling, 4 reading a selector, 5 listing pods, 6 a deployment that still had pods at the deadline.
- name: Scale each deployment that holds database connections to zero and wait until its pods are gone
  ansible.builtin.shell:
    cmd: |
      set -u
      end=$(( $(date +%s) + DEADLINE ))
      selectors=""
      for name in $DEPLOYMENTS; do
        out=$(k3s kubectl get deployment "$RELEASE-$name" --namespace "$NAMESPACE" --output "$SELECTOR_TEMPLATE" 2>&1) || {
          case "$out" in
            *NotFound*) continue ;;
            *) exit 4 ;;
          esac
        }
        selector=${out%,}
        [ -n "$selector" ] || exit 4
        k3s kubectl scale deployment "$RELEASE-$name" --namespace "$NAMESPACE" --replicas=0 >/dev/null 2>&1 || exit 3
        selectors="$selectors $selector"
      done
      for selector in $selectors; do
        while :; do
          listed=$(k3s kubectl get pods --namespace "$NAMESPACE" --selector "$selector" --output name 2>/dev/null) || exit 5
          [ -z "$listed" ] && break
          [ "$(date +%s)" -lt "$end" ] || exit 6
          sleep 1
        done
      done
  environment:
    DEPLOYMENTS: "{{ airbyte_recreate_deployments | join(' ') }}"
    RELEASE: "{{ airbyte_release }}"
    NAMESPACE: "{{ airbyte_namespace }}"
    DEADLINE: "{{ airbyte_scale_down_deadline_seconds }}"
    SELECTOR_TEMPLATE: "{% raw %}go-template={{range $key, $value := .spec.selector.matchLabels}}{{$key}}={{$value}},{{end}}{% endraw %}"
  register: airbyte_release_scale_down
  changed_when: true
  failed_when: false
  no_log: true
  timeout: "{{ airbyte_scale_down_deadline_seconds | int + 120 }}"

- name: Stop when the pods of the deployments could not be taken away
  when: airbyte_release_scale_down.rc != 0
  ansible.builtin.fail:
    msg: >-
      k3s could not take the pods of the Airbyte deployments {{ airbyte_recreate_deployments | join(', ') }} away before the rollback of the release {{ airbyte_release }}
      (exit status {{ airbyte_release_scale_down.rc }}: 3 scaling, 4 reading a selector, 5 listing pods, 6 a deployment still had pods after {{ airbyte_scale_down_deadline_seconds }} seconds),
      so the release was not rolled back and a rollback to older manifests could have started a new pod beside an old one that holds its database connections.
      Run kubectl get pods by hand to see which pods stay.
