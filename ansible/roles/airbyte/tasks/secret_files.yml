# Reads airbyte_secrets_directory and secret_files_root_owner. The module creates only missing files, gives each file mode 0400 and the root owner, requires
# the database password file and prints no value.
- name: Create the missing generated secret files of Airbyte
  airbyte_secrets:
    step: files
    secrets_directory: "{{ airbyte_secrets_directory }}"
    root_owner: "{{ secret_files_root_owner }}"
