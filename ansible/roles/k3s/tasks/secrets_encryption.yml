# Reads k3s_ready_deadline_seconds. A cluster that started with the flag is already encrypted. One that started without it is switched on with the
# procedure of k3s's documentation for an existing cluster: enable, restart with the flag, rotate the keys and restart again. Each wait ends at its deadline.
# Each read registers its own name and then sets k3s_secrets_status: a skipped task still stores its register, so a shared name would lose the reading.
- name: Read the secret encryption status
  ansible.builtin.command:
    cmd: k3s secrets-encrypt status
  register: k3s_secrets_first_read
  changed_when: false
  failed_when: false
  timeout: 60

- name: Keep the first reading as the current status
  ansible.builtin.set_fact:
    k3s_secrets_status: "{{ k3s_secrets_first_read }}"

- name: Create the encryption configuration where the cluster has none, and restart with the flag
  when: "'no configuration file found' in k3s_secrets_status.stdout"
  block:
    - name: Create the encryption configuration
      ansible.builtin.command:
        cmd: k3s secrets-encrypt enable
      changed_when: true
      timeout: 60

    - name: Restart k3s so that it starts with the encryption configuration
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted

    - name: Wait for the k3s node to be ready after the restart
      ansible.builtin.include_tasks: wait_ready.yml

    - name: Read the secret encryption status again
      ansible.builtin.command:
        cmd: k3s secrets-encrypt status
      register: k3s_secrets_enabled_read
      changed_when: false
      failed_when: false
      timeout: 60

    - name: Keep the reading after the enable as the current status
      ansible.builtin.set_fact:
        k3s_secrets_status: "{{ k3s_secrets_enabled_read }}"

# At the start stage, enabled or not, stored secrets may predate the key (a restart with the flag on an existing cluster shows Enabled
# at start), so the keys are rotated once and every secret re-encrypted; a finished rotation is never repeated.
- name: Rotate the keys so that encryption is on and every secret is re-encrypted
  when: "'Current Rotation Stage: start' in k3s_secrets_status.stdout"
  block:
    - name: Start the key rotation
      ansible.builtin.command:
        cmd: k3s secrets-encrypt rotate-keys
      changed_when: true
      timeout: 120

    - name: Wait until the re-encryption has finished
      ansible.builtin.command:
        cmd: k3s secrets-encrypt status
      register: k3s_secrets_rotation_read
      changed_when: false
      retries: "{{ (k3s_ready_deadline_seconds / 5) | int }}"
      delay: 5
      until: "'Current Rotation Stage: reencrypt_finished' in k3s_secrets_rotation_read.stdout"
      timeout: 60

    - name: Restart k3s with the same arguments, as the rotation requires
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted

    - name: Wait for the k3s node to be ready after the second restart
      ansible.builtin.include_tasks: wait_ready.yml

    - name: Read the secret encryption status after the restart
      ansible.builtin.command:
        cmd: k3s secrets-encrypt status
      register: k3s_secrets_restarted_read
      changed_when: false
      timeout: 60

    - name: Keep the reading after the restart as the current status
      ansible.builtin.set_fact:
        k3s_secrets_status: "{{ k3s_secrets_restarted_read }}"

- name: Confirm secret encryption at rest is on
  ansible.builtin.include_tasks: verify_secrets_encryption.yml
