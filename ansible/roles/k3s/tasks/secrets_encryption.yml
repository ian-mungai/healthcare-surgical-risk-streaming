# Reads k3s_ready_deadline_seconds. A cluster that started with the flag is already encrypted. One with no encryption configuration is restarted with
# the flag already on disk, and k3s makes the configuration as it starts; enable is never called, since the pinned k3s keeps the identity-only
# file that enable writes (review recheck 3). No key rotation runs: the pinned rotate-keys can drop a key in use (owner Q64, Nov 23 2026). Each wait ends at its deadline.
# Each read registers its own name and then sets k3s_secrets_status: a skipped task still stores its register, so a shared name would lose the reading.
- name: Read the secret encryption status
  ansible.builtin.command:
    cmd: k3s secrets-encrypt status
  register: k3s_secrets_first_read
  changed_when: false
  failed_when: false
  timeout: 60

- name: Keep the first reading as the current status
  ansible.builtin.set_fact:
    k3s_secrets_status: "{{ k3s_secrets_first_read }}"

- name: Restart k3s with the flag already on disk where the cluster has no encryption configuration
  when: "'no configuration file found' in k3s_secrets_status.stdout"
  block:
    - name: Restart k3s so that it starts with the flag and makes its encryption configuration
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted

    - name: Wait for the k3s node to be ready after the restart
      ansible.builtin.include_tasks: wait_ready.yml

    - name: Read the secret encryption status again
      ansible.builtin.command:
        cmd: k3s secrets-encrypt status
      register: k3s_secrets_enabled_read
      changed_when: false
      failed_when: false
      timeout: 60

    - name: Keep the reading after the restart as the current status
      ansible.builtin.set_fact:
        k3s_secrets_status: "{{ k3s_secrets_enabled_read }}"

- name: Confirm secret encryption at rest is on
  ansible.builtin.include_tasks: verify_secrets_encryption.yml
