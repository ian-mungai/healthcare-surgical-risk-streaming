# Reads k3s_ready_deadline_seconds. Each try waits 20 seconds and 5 more between tries, so the loop ends at the deadline.
- name: Wait for the k3s node to be ready
  ansible.builtin.command:
    cmd: k3s kubectl wait --for=condition=Ready node --all --timeout=20s
  register: k3s_node_ready
  changed_when: false
  retries: "{{ (k3s_ready_deadline_seconds / 25) | int }}"
  delay: 5
  until: k3s_node_ready.rc == 0
  timeout: 30
