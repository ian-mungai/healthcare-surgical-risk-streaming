# Reads k3s_secrets_status, which the role registers from `k3s secrets-encrypt status`.
- name: Confirm secret encryption at rest is on and its keys finished re-encrypting
  ansible.builtin.assert:
    that:
      - "'Encryption Status: Enabled' in k3s_secrets_status.stdout"
      - "'Current Rotation Stage: reencrypt_finished' in k3s_secrets_status.stdout"
    fail_msg: k3s secret encryption at rest is not on, or its keys have not finished re-encrypting. Status as reported {{ k3s_secrets_status.stdout | default('empty') }}
