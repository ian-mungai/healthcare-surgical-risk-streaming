# Reads k3s_secrets_status, the latest `k3s secrets-encrypt status` reading that secrets_encryption.yml keeps as a fact.
# Owner Q64 (Nov 23 2026): Enabled at the start or reencrypt_finished stage with every server's hash matching proves new secrets encrypted.
# Recorded limit: on a cluster switched on after first boot, secrets written before the flag may keep plain-text copies in Kine rows,
# protected by the host's encrypted disk. A fresh host starts with the flag, so every secret is encrypted when written.
- name: Confirm secret encryption at rest is on, no key rotation is in progress and every server's hash matches
  ansible.builtin.assert:
    that:
      - "'Encryption Status: Enabled' in k3s_secrets_status.stdout"
      - "'Current Rotation Stage: start' in k3s_secrets_status.stdout or 'Current Rotation Stage: reencrypt_finished' in k3s_secrets_status.stdout"
      - "'Server Encryption Hashes: All hashes match' in k3s_secrets_status.stdout"
    fail_msg: k3s secret encryption at rest is not on, a key rotation is in progress or a server's hash differs. Status as reported {{ k3s_secrets_status.stdout | default('empty') }}
