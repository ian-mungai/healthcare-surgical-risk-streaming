# Reads k3s_secrets_status, the latest `k3s secrets-encrypt status` reading that secrets_encryption.yml keeps as a fact.
# Only a finished key rotation proves every stored secret encrypted: a cluster switched on by a restart with the flag also shows the start
# stage while its older secrets stay in plain text, so the role rotates once and this check needs reencrypt_finished with every hash matching.
- name: Confirm secret encryption at rest is on, its keys finished re-encrypting and every server's hash matches
  ansible.builtin.assert:
    that:
      - "'Encryption Status: Enabled' in k3s_secrets_status.stdout"
      - "'Current Rotation Stage: reencrypt_finished' in k3s_secrets_status.stdout"
      - "'Server Encryption Hashes: All hashes match' in k3s_secrets_status.stdout"
    fail_msg: k3s secret encryption at rest is not on, or its keys have not finished re-encrypting. Status as reported {{ k3s_secrets_status.stdout | default('empty') }}
