# Reads k3s_secrets_status, the latest `k3s secrets-encrypt status` reading that secrets_encryption.yml keeps as a fact.
# A cluster that started with encryption on stays at the start stage; one switched on later ends at reencrypt_finished. Either is
# encrypted when every server's hash matches; a rotation in progress or any other stage is refused.
- name: Confirm secret encryption at rest is on, its keys are not mid-rotation and every server's hash matches
  ansible.builtin.assert:
    that:
      - "'Encryption Status: Enabled' in k3s_secrets_status.stdout"
      - "'Current Rotation Stage: start' in k3s_secrets_status.stdout or 'Current Rotation Stage: reencrypt_finished' in k3s_secrets_status.stdout"
      - "'Server Encryption Hashes: All hashes match' in k3s_secrets_status.stdout"
    fail_msg: k3s secret encryption at rest is not on, or its keys have not finished re-encrypting. Status as reported {{ k3s_secrets_status.stdout | default('empty') }}
