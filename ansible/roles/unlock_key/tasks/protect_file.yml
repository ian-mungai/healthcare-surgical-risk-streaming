# Reads unlock_key_file and openbao_user. The file is for the numeric user of the container that reads it, and for nobody else.
- name: Give the unlock key file to the user of the OpenBao container
  ansible.builtin.file:
    path: "{{ unlock_key_file }}"
    state: file
    owner: "{{ openbao_user.split(':')[0] }}"
    group: "{{ openbao_user.split(':')[1] }}"
    mode: "0400"
