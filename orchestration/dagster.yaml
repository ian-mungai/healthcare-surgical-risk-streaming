telemetry:
  enabled: false

storage:
  postgres:
    postgres_db:
      username: dagster
      hostname: postgres
      db_name: dagster
      port: 5432
      params:
        passfile: /run/dagster/pgpass

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

# One run of a heavy job at a time: the code gives a heavy job the tag below (surgical_risk/concurrency.py) and the run queue holds a second one until the first ends.
# The limit names the key and no value, so every run that carries the key shares the one slot, also a run whose launch set another value for the key.
concurrency:
  runs:
    tag_concurrency_limits:
      - key: surgical_risk/heavy
        limit: 1
    # Each run is a process that holds up to two PostgreSQL connections at once, so this number is part of the budget in compose/postgres_connections.yml. The default is 10.
    max_concurrent_runs: 3

run_launcher:
  module: dagster
  class: DefaultRunLauncher

retention:
  schedule:
    purge_after_days: 30
  sensor:
    purge_after_days:
      skipped: 1
      success: 30
      failure: 30
      started: 30
