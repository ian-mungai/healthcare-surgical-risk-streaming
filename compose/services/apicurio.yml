services:
  apicurio:
    image: apicurio/apicurio-registry:3.3.5@sha256:1b58c48774500fa41ed676a72bc5e60b5fc7de9c0473488732c5b83d579b45d1
    platform: linux/amd64
    mem_limit: ${MEM_LIMIT_APICURIO:?render the limits first}
    restart: unless-stopped
    user: "10002:10002"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apicurio
      APICURIO_DATASOURCE_USERNAME: apicurio
      APICURIO_DATASOURCE_PASSWORD_FILE: /run/secrets/apicurio_database_password
    secrets:
      - apicurio_database_password
    volumes:
      - apicurio_data:/deployments/data
    ports:
      - 127.0.0.1:${APICURIO_HOST_PORT:-8081}:8080
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent --max-time 4 http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s

secrets:
  apicurio_database_password:
    file: ${SECRETS_DIR:?render the host settings first}/postgres/apicurio.password

volumes:
  apicurio_data:
