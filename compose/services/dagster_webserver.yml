services:
  dagster_webserver:
    image: ${IMAGE_DAGSTER:?render the image pins first}
    platform: linux/amd64
    mem_limit: ${MEM_LIMIT_DAGSTER_WEBSERVER:?render the limits first}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    # The overflow of each of the three storage pools (compose/postgres_connections.yml). The default is 20, so the web server could hold 63 connections.
    command: [dagster-webserver, --host, 0.0.0.0, --port, "3000", --workspace, /opt/dagster/instance/workspace.yaml, --db-pool-max-overflow, "2"]
    depends_on:
      postgres:
        condition: service_healthy
      dagster_code_location:
        condition: service_healthy
    secrets:
      - dagster_postgres_password
    tmpfs:
      - /run/dagster:uid=10001,gid=10001,mode=0700
    volumes:
      - dagster_storage:/opt/dagster/instance/storage
    ports:
      - 127.0.0.1:${DAGSTER_WEBSERVER_HOST_PORT:-3001}:3000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=5).read()"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 60s

secrets:
  dagster_postgres_password:
    file: ${SECRETS_DIR:?render the host settings first}/postgres/dagster.password

volumes:
  dagster_storage:
