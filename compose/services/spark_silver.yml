services:
  spark_silver:
    image: surgical-risk-spark:4.1.4
    build:
      context: ../..
      dockerfile: spark/Dockerfile
    platform: linux/amd64
    profiles: [batch_silver]
    mem_limit: ${MEM_LIMIT_SPARK_SILVER:?render the limits first}
    restart: "no"
    user: "10100:10100"
    group_add: ["20107"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      nessie:
        condition: service_healthy
    entrypoint: [python, -m, spark.jobs.silver_cases]
    environment:
      NESSIE_URI: ${NESSIE_URI:-http://nessie:19120/api/v2}
      WAREHOUSE_LOCATION: ${WAREHOUSE_LOCATION:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_CONFIG_FILE: /etc/workload_access/client_config
      AWS_EC2_METADATA_DISABLED: "true"
    configs:
      - source: silver_aws_client_config
        target: /etc/workload_access/client_config
    volumes:
      - spark_silver_scratch:/scratch
      - lake_warehouse:/warehouse
      - workload_access_silver:/run/workload_access:ro

configs:
  silver_aws_client_config:
    file: ${AWS_CLIENT_CONFIG_FILE:-/etc/workload_access/client_config}

volumes:
  spark_silver_scratch:
  lake_warehouse:
  workload_access_silver:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SILVER_ACCESS_DIR:-/run/workload_access/silver}
