services:
  kafka:
    image: apache/kafka:4.4.0@sha256:76af3d0116abbb33b4cd964af410d4921c33d1f663e7a95d5453a9c35a84869b
    platform: linux/amd64
    mem_limit: ${MEM_LIMIT_KAFKA:?render the limits first}
    restart: unless-stopped
    stop_grace_period: 60s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      CLUSTER_ID: 9sgpkHwPQHet5xXY2ASAdA
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:9094,CONTROLLER://127.0.0.1:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "10"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_RETENTION_BYTES: "268435456"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "30000"
      KAFKA_LOG_SEGMENT_DELETE_DELAY_MS: "10000"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      # The launch script starts an unauthenticated JMX agent on every address when this is unset. Any value that holds no jmxremote setting stops it.
      KAFKA_JMX_OPTS: -Djava.awt.headless=true
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - 127.0.0.1:${KAFKA_HOST_PORT:-9094}:9094
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  kafka_data:
