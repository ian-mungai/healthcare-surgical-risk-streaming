services:
  caddy:
    image: caddy:2.11.9@sha256:fc9cbc100585871d18d4e451cca7021785c90a7006087427ae5ceb3e4efe6424
    platform: linux/amd64
    mem_limit: ${MEM_LIMIT_CADDY:?render the limits first}
    restart: unless-stopped
    network_mode: host
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - ../caddy/host.env
    command:
      - sh
      - -c
      - |
        case "$$TS_ADDRESS" in
          ""|0.0.0.0|127.*) echo "caddy: TS_ADDRESS must be the host's Tailscale address, found '$$TS_ADDRESS'" >&2; exit 1 ;;
        esac
        echo "$$TS_ADDRESS" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$$' || { echo "caddy: TS_ADDRESS is not an IPv4 address" >&2; exit 1; }
        test -n "$$TS_HOST_NAME" || { echo "caddy: TS_HOST_NAME is empty" >&2; exit 1; }
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - /var/run/tailscale:/var/run/tailscale:ro
    healthcheck:
      test: [CMD-SHELL, 'nc -w 3 $$TS_ADDRESS 9440 < /dev/null']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
      start_interval: 2s

configs:
  caddyfile:
    file: ../caddy/Caddyfile

volumes:
  caddy_data:
