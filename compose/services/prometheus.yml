services:
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:89c1a644817e9ad70fa2af76c84898e327c1de7063735f962e8313b1e28672c3
    platform: linux/amd64
    mem_limit: ${MEM_LIMIT_PROMETHEUS:?render the limits first}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=4GB
      - --web.enable-remote-write-receiver
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    ports:
      - 127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

configs:
  prometheus_config:
    file: ../monitoring/prometheus.yml

volumes:
  prometheus_data:
