services:
  postgres:
    image: postgres:18.7@sha256:ec003ee60c23d320d1b81868f255a6fc724ac06d8f1ced4468532f7d8593f357
    platform: linux/amd64
    mem_limit: ${MEM_LIMIT_POSTGRES:?render the limits first}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    secrets:
      - postgres_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready --host 127.0.0.1 --username postgres --dbname postgres]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

secrets:
  postgres_admin_password:
    file: ${SECRETS_DIR:?render the host settings first}/postgres/postgres.password

volumes:
  postgres_data:
