name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A push to main has a concurrency group of its own (its run), so no push cancels or replaces another run, even the same commit pushed again; a
# newer commit of the same pull request cancels the older run.
# Every pull request and every push to main runs every job: no job has a condition, no step tolerates a failure and no run takes the
# result of an earlier run. The last job waits for all the others and is the one required check: it fails unless each of them succeeded, so a failed,
# cancelled or skipped job fails the run. tests/fast/test_ci_workflow.py holds the workflow to this.
jobs:
  hooks:
    name: Hooks on every file and the commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: make setup
      - run: make check
      - name: Check the commit messages of the pushed range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            .venv/bin/python -m scripts.quality.repo_checks commit-range "${BASE}..${HEAD}"
          else
            .venv/bin/python -m scripts.quality.repo_checks commit-range "${HEAD}"
          fi

  infrastructure:
    name: Static checks of the Terraform and Ansible code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - run: make setup
      - run: make check-terraform
      - run: make check-ansible

  # Measured hosted wall time of one shard: 5 to 11 minutes.
  guards:
    name: Planted faults through the real commit path, shard ${{ matrix.shard }} of 8
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: make setup
      - run: make test-guards SHARD="${SHARD}/8"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Show the end of the run's log after a failure
        if: failure()
        run: tail -n 150 runs/*/log.txt
      - name: Check that the run record and its retention label exist
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          folders=(runs/*/)
          if [ "${#folders[@]}" -eq 0 ]; then
            echo "No run folder was written under runs/." >&2
            exit 1
          fi
          incomplete=0
          for folder in "${folders[@]}"; do
            for file in record.json retention.json; do
              if [ ! -f "${folder}${file}" ]; then
                printf 'The run folder %s has no %s.\n' "${folder}" "${file}" >&2
                incomplete=1
              fi
            done
          done
          exit "${incomplete}"
      - name: Keep the run record and its retention label
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guard-record-shard-${{ matrix.shard }}
          path: |
            runs/*/record.json
            runs/*/retention.json
          if-no-files-found: error
          retention-days: 30

  deadline:
    name: A project wait passes its deadline and fails visibly
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # estimate until the first hosted run: make setup about 2 minutes, the case 10 seconds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: make setup
      - run: make test-deadline
      - name: Check that the run record and its retention label exist
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          folders=(runs/*/)
          if [ "${#folders[@]}" -eq 0 ]; then
            echo "No run folder was written under runs/." >&2
            exit 1
          fi
          incomplete=0
          for folder in "${folders[@]}"; do
            for file in record.json retention.json; do
              if [ ! -f "${folder}${file}" ]; then
                printf 'The run folder %s has no %s.\n' "${folder}" "${file}" >&2
                incomplete=1
              fi
            done
          done
          exit "${incomplete}"
      - name: Keep the run record and its retention label
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deadline-record
          path: |
            runs/*/record.json
            runs/*/retention.json
          if-no-files-found: error
          retention-days: 30

  required:
    name: Every job of this run passed
    needs: [hooks, infrastructure, guards, deadline]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that every needed job succeeded
        shell: bash
        env:
          HOOKS: ${{ needs.hooks.result }}
          INFRASTRUCTURE: ${{ needs.infrastructure.result }}
          GUARDS: ${{ needs.guards.result }}
          DEADLINE: ${{ needs.deadline.result }}
        run: |
          failed=0
          check() {
            if [ "$2" != success ]; then
              printf 'The job %s ended as %s, not as success.\n' "$1" "$2" | tee -a "${GITHUB_STEP_SUMMARY}"
              failed=1
            fi
          }
          check hooks "${HOOKS}"
          check infrastructure "${INFRASTRUCTURE}"
          check guards "${GUARDS}"
          check deadline "${DEADLINE}"
          exit "${failed}"
