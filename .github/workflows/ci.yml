name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hooks:
    name: Hooks on every file and the commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: make setup
      - run: make check
      - name: Check the commit messages of the pushed range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            .venv/bin/python -m scripts.quality.repo_checks commit-range "${BASE}..${HEAD}"
          else
            .venv/bin/python -m scripts.quality.repo_checks commit-range "${HEAD}"
          fi

  guards:
    name: Planted faults through the real commit path, shard ${{ matrix.shard }} of 8
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # measured hosted wall time of one shard: 5 to 11 minutes
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: make setup
      - run: make test-guards SHARD="${SHARD}/8"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Show the end of the run's log after a failure
        if: failure()
        run: tail -n 150 runs/*/log.txt

  infrastructure:
    name: Static checks of the Terraform and Ansible code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - run: make setup
      - run: make check-terraform
      - run: make check-ansible
