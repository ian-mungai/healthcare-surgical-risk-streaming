name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

# Check-first CI: every run runs every job in full, with no condition on a job or a step, no tolerated failure and no result taken from an earlier run. A run starts on
# each push of a work branch, on each pull request, once on the main commit that a squash merge creates (the repository's recorded exception: main moves only
# through a pull request that is up to date with main), every Monday and on demand. A newer push of a work branch or a newer commit of a pull request cancels
# the older run of its ref; a run on main, a scheduled run and a manual run have a group of their own (their run) and are never cancelled or replaced.
# The job "required" waits for all the gating jobs and is the one required check: it fails unless each of them succeeded, so a failed, cancelled or
# skipped job fails the run, and unless every guard shard set its own success output, because GitHub can report success for a leg that never ran.
# The job "headroom" is outside the required check: it reads the run's jobs and fails any job over 80% of its timeout. Each timeout is at least twice the
# duration recorded beside it. tests/fast/test_ci_workflow.py holds the workflow to all of this.
jobs:
  hooks:
    name: Hooks on every file and the commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # measured 3.5 min: make setup about 2 minutes (estimate), make check 76 seconds locally; the first hosted run replaces it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: make setup
      - run: make check
      - name: Check the commit messages of the pushed range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            .venv/bin/python -m scripts.quality.repo_checks commit-range "${BASE}..${HEAD}"
          else
            .venv/bin/python -m scripts.quality.repo_checks commit-range "${HEAD}"
          fi

  infrastructure:
    name: Static checks of the Terraform and Ansible code
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # measured 2.5 min: make setup about 2 minutes (estimate), the two static checks 6 seconds locally; the first hosted run replaces it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - run: make setup
      - run: make check-terraform
      - run: make check-ansible

  slow:
    name: "The slow tests: Ansible roles, local servers and stand-ins, and planted workflow faults"
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # measured 12.5 min: make setup about 2 minutes (estimate), the slow group about 10.5 minutes locally; the first hosted run replaces it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: make setup
      - run: make test-slow

  guards:
    name: Planted faults through the real commit path, shard ${{ matrix.shard }} of 8
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # measured 11 min: hosted wall time of the slowest shard (the shards take 5 to 11 minutes)
    outputs:
      shard_1: ${{ steps.leg.outputs.shard_1 }}
      shard_2: ${{ steps.leg.outputs.shard_2 }}
      shard_3: ${{ steps.leg.outputs.shard_3 }}
      shard_4: ${{ steps.leg.outputs.shard_4 }}
      shard_5: ${{ steps.leg.outputs.shard_5 }}
      shard_6: ${{ steps.leg.outputs.shard_6 }}
      shard_7: ${{ steps.leg.outputs.shard_7 }}
      shard_8: ${{ steps.leg.outputs.shard_8 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: make setup
      - run: make test-guards SHARD="${SHARD}/8"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Show the end of the run's log after a failure
        if: failure()
        run: tail -n 150 runs/*/log.txt
      - name: Check that the run record and its retention label exist
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          folders=(runs/*/)
          if [ "${#folders[@]}" -eq 0 ]; then
            echo "No run folder was written under runs/." >&2
            exit 1
          fi
          incomplete=0
          for folder in "${folders[@]}"; do
            for file in record.json retention.json; do
              if [ ! -f "${folder}${file}" ] || [ -L "${folder}${file}" ]; then
                printf 'The run folder %s has no %s.\n' "${folder}" "${file}" >&2
                incomplete=1
              fi
            done
          done
          exit "${incomplete}"
      - name: Keep the run record and its retention label
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guard-record-shard-${{ matrix.shard }}
          path: |
            runs/*/record.json
            runs/*/retention.json
          if-no-files-found: error
          retention-days: 30
      - id: leg
        name: Set this shard's own success output
        run: echo "shard_${SHARD}=success" >> "${GITHUB_OUTPUT}"
        env:
          SHARD: ${{ matrix.shard }}

  deadline:
    name: A project wait passes its deadline and fails visibly
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # measured 2.2 min: make setup about 2 minutes (estimate), the case 9 seconds locally; the first hosted run replaces it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: make setup
      - run: make test-deadline
      - name: Check that the run record and its retention label exist
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          folders=(runs/*/)
          if [ "${#folders[@]}" -eq 0 ]; then
            echo "No run folder was written under runs/." >&2
            exit 1
          fi
          incomplete=0
          for folder in "${folders[@]}"; do
            for file in record.json retention.json; do
              if [ ! -f "${folder}${file}" ] || [ -L "${folder}${file}" ]; then
                printf 'The run folder %s has no %s.\n' "${folder}" "${file}" >&2
                incomplete=1
              fi
            done
          done
          exit "${incomplete}"
      - name: Keep the run record and its retention label
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deadline-record
          path: |
            runs/*/record.json
            runs/*/retention.json
          if-no-files-found: error
          retention-days: 30

  required:
    name: Every job of this run passed
    needs: [hooks, infrastructure, slow, guards, deadline]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # measured 0.1 min: one short script; the first hosted run replaces it
    steps:
      - name: Check that every needed job succeeded
        shell: bash
        env:
          HOOKS: ${{ needs.hooks.result }}
          INFRASTRUCTURE: ${{ needs.infrastructure.result }}
          SLOW: ${{ needs.slow.result }}
          GUARDS: ${{ needs.guards.result }}
          DEADLINE: ${{ needs.deadline.result }}
          GUARD_1: ${{ needs.guards.outputs.shard_1 }}
          GUARD_2: ${{ needs.guards.outputs.shard_2 }}
          GUARD_3: ${{ needs.guards.outputs.shard_3 }}
          GUARD_4: ${{ needs.guards.outputs.shard_4 }}
          GUARD_5: ${{ needs.guards.outputs.shard_5 }}
          GUARD_6: ${{ needs.guards.outputs.shard_6 }}
          GUARD_7: ${{ needs.guards.outputs.shard_7 }}
          GUARD_8: ${{ needs.guards.outputs.shard_8 }}
        run: |
          failed=0
          check() {
            if [ "$2" != success ]; then
              printf 'The job %s ended as %s, not as success.\n' "$1" "$2" | tee -a "${GITHUB_STEP_SUMMARY}"
              failed=1
            fi
          }
          check hooks "${HOOKS}"
          check infrastructure "${INFRASTRUCTURE}"
          check slow "${SLOW}"
          check guards "${GUARDS}"
          check deadline "${DEADLINE}"
          check_leg() {
            if [ "$2" != success ]; then
              printf 'The guards shard %s did not set its success output.\n' "$1" | tee -a "${GITHUB_STEP_SUMMARY}"
              failed=1
            fi
          }
          check_leg 1 "${GUARD_1}"
          check_leg 2 "${GUARD_2}"
          check_leg 3 "${GUARD_3}"
          check_leg 4 "${GUARD_4}"
          check_leg 5 "${GUARD_5}"
          check_leg 6 "${GUARD_6}"
          check_leg 7 "${GUARD_7}"
          check_leg 8 "${GUARD_8}"
          exit "${failed}"

  headroom:
    name: No job of this run is near its time limit
    needs: [hooks, infrastructure, slow, guards, deadline]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # measured 2.5 min: make setup about 2 minutes (estimate), the check a few seconds; the first hosted run replaces it
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: make setup
      - run: make headroom
        env:
          GH_TOKEN: ${{ github.token }}
