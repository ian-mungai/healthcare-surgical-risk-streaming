[tool.ruff]
line-length = 160
target-version = "py314"

# Files that Ansible copies to the host run on the host's Python, which is 3.12 on Ubuntu 24.04.
[tool.ruff.per-file-target-version]
"ansible/roles/*/files/*.py" = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "T20"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["infra", "scripts", "tests"]
